          persist-credentials: false
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: 1
      - name: Install native runtime dependencies
        run: sudo apt-get update -qq && sudo apt-get install --no-install-recommends -y libvips
      - name: Create test databases
        run: env RAILS_ENV=test bin/rails db:create
      - name: Setup test databases
        # Same command as config/ci.rb; the list must cover every verified test database.
        run: >-
          POSTGRESQL_TEST_PREPARE_DATABASES=test_primary_db,test_publishing_db,test_app_zenith_db,test_com_zenith_db,test_org_zenith_db,test_app_setting_db,test_com_setting_db,test_org_setting_db,test_app_ticket_db,test_com_ticket_db,test_org_ticket_db,test_app_signal_db,test_com_signal_db,test_org_signal_db,test_avatar_db,test_chronicle_db,test_occurrence_db,test_queue_db,test_search_db,test_storage_db
          env RAILS_ENV=test bin/rails db:test:prepare
      - name: Run Rails tests with coverage
        run: env COVERAGE=true bin/rails test test/
      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: rails-coverage-${{ github.sha }}
          path: coverage/
          retention-days: 30
          compression-level: 6
  lint-js:
    name: JavaScript Checks (oxlint, oxfmt, typecheck, vitest)
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - name: Format check (oxfmt)
        run: bun run format:check
      - name: Lint (oxlint)
        run: bun run lint
      - name: Typecheck (tsc)
        run: bun run typecheck
      - name: Test (vitest, with coverage)
        run: bun run test:coverage
      - name: Upload JavaScript coverage
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: vite-coverage-${{ github.sha }}
          path: coverage/vite/
          retention-days: 30
          compression-level: 6
  scan-gems:
    name: Dependency Scan (Gemfile.lock)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          persist-credentials: false
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: 1
      - name: Scan Gemfile.lock for known gem vulnerabilities
        run: bin/bundler-audit check --update --format json --output bundler-audit.json
      - name: Summarize advisories by criticality
        if: always() && hashFiles('bundler-audit.json') != ''
        run: |
          jq -r '
            [.results[]? | .advisory.criticality // "unknown"]
            | group_by(.)
            | map("\(.[0]): \(length)")
            | if length == 0 then ["no advisories"] else . end
            | .[]
          ' bundler-audit.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload bundler-audit report
        if: always() && hashFiles('bundler-audit.json') != ''
        uses: actions/upload-artifact@v6.0.0
        with:
          name: bundler-audit-report-${{ github.sha }}
          path: bundler-audit.json
          retention-days: 30
  scan-bun:
    name: Dependency Scan (bun.lock)
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Run Bun dependency audit
        run: |
          set -o pipefail
          bun audit --audit-level=moderate 2>&1 | tee bun-audit.txt
      - name: Upload Bun audit report
        if: always() && hashFiles('bun-audit.txt') != ''
        uses: actions/upload-artifact@v6.0.0
        with:
          name: bun-audit-report-${{ github.sha }}
          path: bun-audit.txt
          retention-days: 30
          compression-level: 6
