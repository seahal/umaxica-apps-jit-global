# CI/CD Pipeline for Umaxica App
name: "CI"
on:
  push:
    branches: [develop, main]
    paths-ignore:
      - "README.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  # CI Configuration
  CI: true
  # Rails Configuration
  RAILS_ENV: test
  NODE_ENV: test
  # Bundler: install only the default and test groups. ruby/setup-ruby's bundler-cache already
  # installs in deployment (frozen) mode into vendor/bundle, and its cache key includes this value.
  BUNDLE_WITHOUT: development:production
  # Region Configuration
  REGION_CODE: all
  ACME_REGION: true
jobs:
  # ====================
  # FAST CHECKS (Lint & Security)
  # ====================
  lint-actions:
    name: GitHub Actions Lint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: devops-actions/actionlint@v0.1.10
  build-assets:
    name: Production Asset Build (Vite)
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      NODE_ENV: production # ワークフロー既定の test を上書きするのが要点
      VITE_RUBY_MODE: production
      LEFTHOOK: 0
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - run: bunx vite build --mode production
      - name: Assert the production React runtime
        run: |
          if grep -rql "jsx-dev-runtime\|jsxDEV" public/vite/assets; then
            echo "::error::Production bundle contains the React development JSX runtime."
            exit 1
          fi
  security:
    name: Security Checks (Brakeman)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          persist-credentials: false
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true
          cache-version: 1
      - name: Run Brakeman security scanner (SARIF + fail on issues)
        run: bundle exec brakeman -f sarif -o brakeman.sarif --no-pager --quiet -z
      - name: Upload Brakeman SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4.31.10
        with:
          sarif_file: brakeman.sarif
          category: brakeman
        continue-on-error: true
  gitleaks:
    name: Secret Leaks Detection
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_REPORT_PATH: gitleaks.sarif
          GITLEAKS_FORMAT: sarif
          GITLEAKS_FAIL: true
      - name: Upload SARIF to GitHub Security
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4.31.10
        with:
          sarif_file: gitleaks.sarif
        continue-on-error: true
  lint-ruby:
    name: Ruby Linting (RuboCop, ERB)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          persist-credentials: false
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true
          cache-version: 1
      - name: Run RuboCop
        run: bundle exec rubocop --fail-fast --format github
      - name: Run ERB Lint
        run: bundle exec erb_lint --lint-all
  # ====================
  # CORE TESTS
  # ====================
  test-rails:
    name: Rails Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Non-secret baseline comes from .env.example (lib/local_environment.rb loads it when .env
      # is absent). Only test-specific overrides live here; scripts/test-isolated checks them.
      POSTGRESQL_TEST_HOST: 127.0.0.1
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USER: root
      POSTGRESQL_PASSWORD: password
      POSTGRESQL_DATABASE: db
      VALKEY_TEST_HOST: 127.0.0.1
      VALKEY_TEST_PORT: 6379
      CACHE_REDIS_URL: redis://127.0.0.1:6379/3
      RATE_LIMIT_REDIS_URL: redis://127.0.0.1:6379/4
      AUTH_STATE_REDIS_URL: redis://127.0.0.1:6379/5
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      valkey:
        # Same image as compose.yaml so CI and local development run one Valkey version.
        image: valkey/valkey:8.0-alpine3.22
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          persist-credentials: false
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true
          cache-version: 1
      - name: Install native runtime dependencies
        run: sudo apt-get update -qq && sudo apt-get install --no-install-recommends -y libvips
      - name: Setup test databases
        run: bin/rails db:prepare
      - name: Run Rails tests
        run: bin/rails test
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: rails-test-logs-${{ github.sha }}
          path: |
            log/test.log
            tmp/screenshots/
          retention-days: 7
          compression-level: 9
  coverage:
    name: Rails Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Non-secret baseline comes from .env.example (lib/local_environment.rb loads it when .env
      # is absent). Only test-specific overrides live here; scripts/test-isolated checks them.
      POSTGRESQL_TEST_HOST: 127.0.0.1
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USER: root
      POSTGRESQL_PASSWORD: password
      POSTGRESQL_DATABASE: db
      VALKEY_TEST_HOST: 127.0.0.1
      VALKEY_TEST_PORT: 6379
      CACHE_REDIS_URL: redis://127.0.0.1:6379/3
      RATE_LIMIT_REDIS_URL: redis://127.0.0.1:6379/4
      AUTH_STATE_REDIS_URL: redis://127.0.0.1:6379/5
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      valkey:
        # Same image as compose.yaml so CI and local development run one Valkey version.
        image: valkey/valkey:8.0-alpine3.22
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          persist-credentials: false
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true
          cache-version: 1
      - name: Install native runtime dependencies
        run: sudo apt-get update -qq && sudo apt-get install --no-install-recommends -y libvips
      - name: Setup test databases
        run: bin/rails db:prepare
      - name: Run Rails tests with coverage
        run: COVERAGE=true bin/rails test test/
      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: rails-coverage-${{ github.sha }}
          path: coverage/
          retention-days: 30
          compression-level: 6
  lint-js:
    name: JavaScript Checks (oxlint, oxfmt, typecheck, vitest)
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - name: Format check (oxfmt)
        run: bun run format:check
      - name: Lint (oxlint)
        run: bun run lint
      - name: Typecheck (tsc)
        run: bun run typecheck
      - name: Test (vitest, with coverage)
        run: bun run test:coverage
      - name: Upload JavaScript coverage
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: vite-coverage-${{ github.sha }}
          path: coverage/vite/
          retention-days: 30
          compression-level: 6
  scan-gems:
    name: Dependency Scan (Gemfile.lock)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          persist-credentials: false
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true
          cache-version: 1
      - name: Scan Gemfile.lock for known gem vulnerabilities
        run: bin/bundler-audit check --update --format json --output bundler-audit.json
      - name: Summarize advisories by criticality
        if: always() && hashFiles('bundler-audit.json') != ''
        run: |
          jq -r '
            [.results[]? | .advisory.criticality // "unknown"]
            | group_by(.)
            | map("\(.[0]): \(length)")
            | if length == 0 then ["no advisories"] else . end
            | .[]
          ' bundler-audit.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload bundler-audit report
        if: always() && hashFiles('bundler-audit.json') != ''
        uses: actions/upload-artifact@v6.0.0
        with:
          name: bundler-audit-report-${{ github.sha }}
          path: bundler-audit.json
          retention-days: 30
  scan-bun:
    name: Dependency Scan (bun.lock)
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Run Bun dependency audit
        run: |
          set -o pipefail
          bun audit --audit-level=moderate 2>&1 | tee bun-audit.txt
      - name: Upload Bun audit report
        if: always() && hashFiles('bun-audit.txt') != ''
        uses: actions/upload-artifact@v6.0.0
        with:
          name: bun-audit-report-${{ github.sha }}
          path: bun-audit.txt
          retention-days: 30
          compression-level: 6
