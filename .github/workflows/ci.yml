          POSTGRES_DB: db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      valkey:
        # Same image as compose.yaml so CI and local development run one Valkey version.
        image: valkey/valkey:8.0-alpine3.22
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6.0.1
