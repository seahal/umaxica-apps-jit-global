      - name: Check database consistency
        run: bundle exec database_consistency
      - name: Run Rails tests
        run: bin/rails test
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: rails-test-logs-${{ github.sha }}
          path: |
            log/test.log
            tmp/screenshots/
          retention-days: 7
          compression-level: 9
