# CI/CD Pipeline for Umaxica App
name: "CI"
on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  # CI Configuration
  CI: true
  # Rails Configuration
  RAILS_ENV: test
  NODE_ENV: test
  # Bundler: install only the default and test groups. ruby/setup-ruby's bundler-cache already
  # installs in deployment (frozen) mode into vendor/bundle, and its cache key includes this value.
  BUNDLE_WITHOUT: development:production
  # Region Configuration
  REGION_CODE: all
  ACME_REGION: true
jobs:
  # ====================
  # FAST CHECKS (Lint & Security)
  # ====================
  lint-actions:
    name: GitHub Actions Lint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: devops-actions/actionlint@v0.1.10
  build-assets:
    name: Production Asset Build (Vite)
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      NODE_ENV: production # ワークフロー既定の test を上書きするのが要点
      VITE_RUBY_MODE: production
      LEFTHOOK: 0
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - run: bunx vite build --mode production
      - name: Assert the production React runtime
        run: |
          if grep -rql "jsx-dev-runtime\|jsxDEV" public/vite/assets; then
            echo "::error::Production bundle contains the React development JSX runtime."
            exit 1
          fi
  security:
    name: Security Checks (Brakeman)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          persist-credentials: false
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: 1
      - name: Run Brakeman security scanner (SARIF + fail on issues)
        run: bundle exec brakeman -f sarif -o brakeman.sarif --no-pager --quiet -z
      - name: Upload Brakeman SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4.31.10
        with:
          sarif_file: brakeman.sarif
          category: brakeman
        continue-on-error: true
  gitleaks:
    name: Secret Leaks Detection
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_REPORT_PATH: gitleaks.sarif
          GITLEAKS_FORMAT: sarif
          GITLEAKS_FAIL: true
      - name: Upload SARIF to GitHub Security
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4.31.10
        with:
          sarif_file: gitleaks.sarif
        continue-on-error: true
  lint-ruby:
    name: Ruby Linting (RuboCop, ERB)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          persist-credentials: false
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: 1
      - name: Run RuboCop
        run: bundle exec rubocop --fail-fast --fail-level convention --format github
      - name: Check frozen string literal placement
        run: ruby scripts/check_frozen_string_literal_directives.rb
      - name: Check frozen string literals
        run: >-
          bundle exec rubocop --config .rubocop_frozen_string_literal.yml --only
          Style/FrozenStringLiteralComment,Style/DisableCopsWithinSourceCodeDirective .
      - name: Run ERB Lint
        run: bundle exec erb_lint --lint-all
  # ====================
  # CORE TESTS
  # ====================
  test-rails:
    name: Rails Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Test-specific overrides.
      POSTGRESQL_TEST_HOST: 127.0.0.1
      POSTGRESQL_PORT: 5432
