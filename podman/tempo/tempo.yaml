server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    # OTLP only. Alloy is the single ingestion gateway
    # (adr/traces-and-metrics-routing-via-alloy.md), and it exports over
    # OTLP/gRPC; the former Jaeger and Zipkin receivers were ingestion paths
    # that bypassed the agent's redaction stage and that nothing sent to.
    #
    # The endpoints are explicit because the embedded OpenTelemetry Collector
    # receiver defaults to `localhost:4317` / `localhost:4318`, which binds the
    # container's loopback only: Alloy then gets `connection refused` dialling
    # `tempo:4317` and every trace is dropped after its retry budget (observed
    # 2026-09-18, before this line existed). 0.0.0.0 here is the container-side
    # listener; Tempo publishes no host port, so this is not host exposure
    # (docs/operations/development-host-port-exposure.md).
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
  trace_idle_period: 5m
  max_block_bytes: 5_000_000
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/traces
