listen_addresses = '*'
# 32 parallel-test workers × 27 reader named connections (per-worker physical
# copies per research/.../2026-05-31-test-parallel-reader-writer-db-split.md) plus
# prepare/schema_load fanout exceeds 1000. 2000 covers the peak.
max_connections = 2000
# Keep admin/superuser slots available even when regular connections are exhausted.
superuser_reserved_connections = 10
# Kill stale sessions that sit inside a transaction and hold resources/locks.
idle_in_transaction_session_timeout = 60s
max_worker_processes = 16
max_parallel_workers_per_gather = 4

# Replication
wal_level = replica
hot_standby = on
max_wal_senders = 10
max_replication_slots = 10
hot_standby_feedback = on

# Test Performance Optimization for Replica
# WARNING: These settings sacrifice durability for speed
# Only use in development/test environments!
checkpoint_timeout = 15min
max_wal_size = 4GB
checkpoint_completion_target = 0.9
wal_compression = on
fsync = on
synchronous_commit = on
full_page_writes = on

# Memory settings for better performance
shared_buffers = 1GB
effective_cache_size = 4GB
# Parallel query allocates DSM segments from POSIX shared memory (/dev/shm),
# which the container caps at the 64MB engine default. The stack deliberately
# carries no shm_size override -- see
# docs/operations/container-engine-podman-notes.md -- so keep the segments in
# $PGDATA/pg_dynshmem, on the data volume, where they are not bound by that cap.
dynamic_shared_memory_type = mmap
# Keep maintenance tasks reasonably fast in dev without excessive memory spikes.
maintenance_work_mem = 128MB
# Conservative per-operation memory so total usage stays predictable at high concurrency.
work_mem = 8MB
# 27 reader DBs × 32 parallel workers each create per-worker copies; schema_load
# acquires many locks on system catalogs simultaneously. Match the writer to
# keep the lock table sized for the test peak.
max_locks_per_transaction = 256
