development:
  dispatchers:
    - polling_interval: 1
      batch_size: 500
      concurrency_maintenance: true
      concurrency_maintenance_interval: 600
      batch_maintenance: true
  scheduler:
    polling_interval: 5
    dynamic_tasks_enabled: false
  workers:
    - queues:
        - default
      threads: 3
      processes:
        <%= Integer(ENV.fetch("JOB_CONCURRENCY", "1"), 10).tap { |value| raise ArgumentError,
        "JOB_CONCURRENCY must be between 1 and 8" unless value.between?(1, 8) } %>
      polling_interval: 0.1
    - queues:
        - retention
      threads: 1
      processes: 1
      polling_interval: 0.1
    - queues:
        - solid_queue_recurring
      threads: 1
      processes: 1
      polling_interval: 0.1

