<%
  # The explicit isolated audit run maps every test role to a comment-marked task DB.
  # DatabaseSafety verifies every effective target against a catalog identity manifest before boot.
  isolated_test_run_id = Rails.env.test? ? ENV["POSTGRESQL_ISOLATED_TEST_RUN_ID"] : nil
  test_database = lambda do |logical_name, normal_name|
    if isolated_test_run_id.present?
      raise ArgumentError, "invalid isolated test run id" unless isolated_test_run_id.match?(/\A[0-9]{8}[a-z0-9]{0,12}\z/)
      "codex_integrity_#{isolated_test_run_id}_#{logical_name}"
    else
      normal_name
    end
  end

  # Rails evaluates every environment in this file while booting. Require Neon
  # connection settings only for production so development and test do not need
  # production credentials merely to parse their own database configuration.
  production_value = lambda do |name|
    value = Rails.env.production? ? ENV.fetch(name) : ENV[name]
    if Rails.env.production? && name.end_with?("PGSSLMODE") && value != "verify-full"
      raise KeyError, "#{name} must be verify-full in production"
    end
    value
  end

  # R5 cell stores are fixed deployment bindings. The connection key is selected by the
  # process configuration before Rails boots; no request, host or token value participates in
  # this lookup. The current local completion scope provisions the twelve JP/WW cells below.
  rp_cells = [
    { connection: "rp_base_app", env_prefix: "RP_BASE_APP", database: "development_rp_base_app_db", client_id: "base-app-ww" },
    { connection: "rp_core_app", env_prefix: "RP_CORE_APP", database: "development_rp_core_app_db", client_id: "core-app-jp" },
    { connection: "rp_warp_app", env_prefix: "RP_WARP_APP", database: "development_rp_warp_app_db", client_id: "warp-app-jp" },
    { connection: "rp_palm_app", env_prefix: "RP_PALM_APP", database: "development_rp_palm_app_db", client_id: "palm-app-jp" },
    { connection: "rp_base_com", env_prefix: "RP_BASE_COM", database: "development_rp_base_com_db", client_id: "base-com-ww" },
    { connection: "rp_core_com", env_prefix: "RP_CORE_COM", database: "development_rp_core_com_db", client_id: "core-com-jp" },
    { connection: "rp_warp_com", env_prefix: "RP_WARP_COM", database: "development_rp_warp_com_db", client_id: "warp-com-jp" },
    { connection: "rp_base_org", env_prefix: "RP_BASE_ORG", database: "development_rp_base_org_db", client_id: "base-org-ww" },
    { connection: "rp_core_org", env_prefix: "RP_CORE_ORG", database: "development_rp_core_org_db", client_id: "core-org-jp" },
    { connection: "rp_warp_org", env_prefix: "RP_WARP_ORG", database: "development_rp_warp_org_db", client_id: "warp-org-jp" },
    { connection: "rp_edit_org", env_prefix: "RP_EDIT_ORG", database: "development_rp_edit_org_db", client_id: "edit-org-ww" },
    { connection: "rp_tech_org", env_prefix: "RP_TECH_ORG", database: "development_rp_tech_org_db", client_id: "tech-org-ww" },
  ].map do |cell|
    cell.merge(
      migrations_path: "db/#{cell.fetch(:connection)}_migrate",
      schema_dump: "#{cell.fetch(:connection)}_structure.sql",
      test_database: cell.fetch(:database).sub("development_", "test_"),
      production_database: "production_#{cell.fetch(:connection)}_db",
    ).freeze
  end.freeze
%>
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 32 } %>
  port: 5432
  timeout: 30000
  lock_timeout: 2s
  # Raised from 2s so background jobs (e.g. RetentionPurgeJob batch deletes) are not
  # killed mid-statement. Web requests are additionally bounded by rack-timeout (10s).
  statement_timeout: 15s
  advisory_locks: false
<% if Rails.env.production? %>
  sslmode: <%= production_value.call("NEON_PGSSLMODE") %>
  channel_binding: <%= production_value.call("NEON_PGCHANNELBINDING") %>
<% end %>
test_default: &test_default
  !!merge <<: *default
  # The committed-transaction concurrency tests retain the test thread's lease
  # while two worker threads use independent connections.
  pool: 3
  # Fixed Dev Container contract (compose.yaml `primary`); test databases are never configured
  # from the environment, so a stray exported variable cannot redirect a destructive preparation.
  host: primary
  username: root
  password: development
  timeout: 20000
  prepared_statements: false
  advisory_locks: true
  lock_timeout: 2s
  statement_timeout: 10s
  variables:
    max_parallel_workers: 0
    max_parallel_workers_per_gather: 0
    max_parallel_maintenance_workers: 0
    jit: off
