<%
  test_host = ENV.fetch("POSTGRESQL_TEST_HOST", ENV.fetch("POSTGRESQL_HOST", "localhost"))

  # Every `development:` host is required configuration: a missing name used to
  # fall back to a shared default, which silently pointed a database at the
  # wrong node instead of reporting the gap. Rails renders this file in full for
  # whichever environment boots, though, so a bare ENV.fetch in that block would
  # also abort `test` and `production` runs that have no development hosts to
  # declare. Enforce presence only when development is the environment actually
  # being booted.
  development_host = lambda do |name|
    Rails.env.development? ? ENV.fetch(name) : ENV[name]
  end
%>
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 32 } %>
  port: 5432
  timeout: 30000
  username: <%= ENV.fetch("POSTGRESQL_USER", "postgres") %>
  password: <%= ENV["POSTGRESQL_PASSWORD"].presence || Rails.application.credentials.dig(:DATABASE, :PASSWORD) %>
  lock_timeout: 2s
  # Raised from 2s so background jobs (e.g. RetentionPurgeJob batch deletes) are not
  # killed mid-statement. Web requests are additionally bounded by rack-timeout (10s).
  statement_timeout: 15s
  advisory_locks: false
test_default: &test_default
  !!merge <<: *default
  pool: 2
  timeout: 20000
  prepared_statements: false
  advisory_locks: true
  lock_timeout: 2s
  statement_timeout: 10s
  variables:
    max_parallel_workers: 0
    max_parallel_workers_per_gather: 0
    max_parallel_maintenance_workers: 0
    jit: off
development_default: &development_default
  !!merge <<: *default
  pool: 2
