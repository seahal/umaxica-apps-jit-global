# Test intentionally has no recurring tasks. The normal test adapter never
# starts a scheduler; development and production list the same business work
# explicitly so a local worker does not silently exercise a different set.

development:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  sign_up_expiry:
    class: SignUpExpiryJob
    queue: retention
    priority: 50
    args: []
    schedule: every 15 minutes
  email_ceremony_transaction_purge:
    class: EmailCeremonyTransactionPurgeJob
    queue: retention
    priority: 50
    args:
      - batch_size: 1000
    schedule: every 15 minutes
  passkey_ceremony_transaction_purge:
    class: PasskeyCeremonyTransactionPurgeJob
    queue: retention
    priority: 50
    args: []
    schedule: every 15 minutes
  secret_credential_ceremony_transaction_purge:
    class: SecretCredentialCeremonyTransactionPurgeJob
    queue: retention
    priority: 50
    args: []
    schedule: every 15 minutes
  social_ceremony_transaction_purge:
    class: SocialCeremonyTransactionPurgeJob
    queue: retention
    priority: 50
    args: []
    schedule: every 15 minutes
  step_up_ceremony_transaction_purge:
    class: StepUpCeremonyTransactionPurgeJob
    queue: retention
    priority: 50
    args:
      - batch_size: 500
    schedule: every 15 minutes
  telephone_ceremony_transaction_purge:
    class: TelephoneCeremonyTransactionPurgeJob
    queue: retention
    priority: 50
    args:
      - batch_size: 500
    schedule: every 15 minutes
  totp_ceremony_transaction_purge:
    class: TotpCeremonyTransactionPurgeJob
    queue: retention
    priority: 50
    args: []
    schedule: every 15 minutes
  retention_purge:
    class: RetentionPurgeJob
    queue: retention
    priority: 50
    args:
      - batch_size: 500
    schedule: every 15 minutes
  dpop_proof_state_purge:
    class: DpopProofStatePurgeJob
    queue: retention
    priority: 50
    args:
      - batch_size: 500
    schedule: every 15 minutes
  security_consumed_jti_purge:
    class: SecurityConsumedJtiPurgeJob
    queue: retention
    priority: 50
    args:
      - batch_size: 500
    schedule: every 15 minutes
  security_one_time_reveal_purge:
    class: SecurityOneTimeRevealPurgeJob
    queue: retention
    priority: 50
    args:
      - batch_size: 500
    schedule: every 15 minutes
  enforcement_expiry:
    class: EnforcementExpiryJob
    queue: retention
    priority: 50
    args:
      - batch_size: 200
    schedule: every 15 minutes
  enforcement_reconciliation:
    class: EnforcementReconciliationJob
    queue: retention
    priority: 50
    args:
      - batch_size: 200
    schedule: every 15 minutes

test: {}

