---
# Shared development infrastructure. The Dev Container application layer lives in
# `.devcontainer/compose.yaml`; this file deliberately contains no `core` service.
# Datastore and emulator publications are loopback-only so host-native Rails and
# OpenTofu can reach them without exposing development services to the LAN.
#
# The file layout:
#
#   compose.yaml                  — infrastructure services and loopback host ports.
#   compose.override.yaml         — UNTRACKED since 2026-09-14, and gitignored. The
#                                   only other root Compose file. It carries the
#                                   opt-in `remote-access` overlay of `core` and is
#                                   where per-machine settings go; untracking it is
#                                   what keeps those per-machine.
#   .devcontainer/compose.yaml    — the Dev Container `core` application service.
#   .devcontainer/compose.override.yml
#                                 — UNTRACKED since 2026-09-14, and gitignored. A
#                                   19-line compatibility overlay for callers that
#                                   load it explicitly; it only restates
#                                   `container_name` values this file already sets,
#                                   so nothing depends on it.
#
# Neither override is required. `devcontainer.json` names its Compose files
# explicitly and includes neither, and a bare `podman compose` skips an override
# that is absent. A fresh clone has neither file and works.
#
# `.devcontainer/devcontainer.json` loads `compose.yaml` and
# `.devcontainer/compose.yaml`, in that order. The Dev Containers CLI passes each
# entry to Compose as `-f`, which also suppresses Compose's auto-discovery of
# `compose.override.yaml` — so the root override applies to a bare
# `docker compose`, not to the editor. Everything in it is profile-gated, so a
# bare `docker compose up` still starts only the infrastructure services.
#
# The `dc` suffix is historical and is kept deliberately: the project name is the
# prefix of every named volume, so changing it would orphan the development
# PostgreSQL, Valkey, bundle, and node_modules volumes.
#
# The name is written WITHOUT separators on purpose. The Dev Containers CLI does
# not read this key: it derives its own project name from `devcontainer.json`'s
# `name` by removing every non-alphanumeric character, and passes the result as
# an explicit `--project-name`. A bare `podman compose` uses this key verbatim.
# Any separator here therefore splits the repository into two Compose projects
# that fight over the hardcoded `global-devcontainer-*` container names and the
# same host ports, so whichever entry point starts second fails.
name: umaxicaappsglobaldc
services:
  fakecloud:
    # Pinned by digest, not by version: the upstream registry publishes only
    # `latest`, `main`, and `sha-<commit>` tags, so there is no semver tag to
    # track. Dependabot's docker ecosystem updates the digest on this form.
    image: ghcr.io/faiscadev/fakecloud:latest@sha256:48b0a8b3f0ee14d0d71f704954e1d2c6b48b88fab67468dd85beb633b33f7dc9
    hostname: fakecloud
    environment:
      # Without this fakecloud keeps every bucket and object in memory, so a
      # restart silently discards local state. Persisting to the named volume
      # below makes `down` keep state and `down -v` discard it.
      FAKECLOUD_STORAGE_MODE: persistent
      FAKECLOUD_DATA_PATH: /var/lib/fakecloud
      FAKECLOUD_LOG: info
    volumes:
      - fakecloud-data:/var/lib/fakecloud
    networks:
      - backend
    # Loopback-only publication so Terraform and the AWS CLI can run from the
    # host, the same reason the former RustFS service published 9000. fakecloud
    # is not a datastore, so this does not weaken the never-publish rule in
    # docs/operations/development-host-port-exposure.md.
    ports:
      - "127.0.0.1:${FAKECLOUD_HOST_PORT:-4566}:4566"
    # Bounded on purpose. Podman applies no backoff to `unless-stopped`, so a
    # service that exits immediately on a bad configuration is recreated several
    # times a second until the netns, veth, conmon, and journald churn saturates
    # a CPU. Three attempts ride out a transient failure and leave a real
    # misconfiguration stopped and visible.
    restart: on-failure:3
    # journald enforces no per-container size cap, and a restart loop writes the same
    # startup failure thousands of times, so a capped json-file driver is what actually
    # bounds the disk cost of a bad configuration. Read it with `podman logs`.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # The upstream image is Debian bookworm carrying only ca-certificates,
    # nftables, kmod, and procps -- it has no curl and no wget, so the health
    # probe published in fakecloud's own docs cannot run here. bash is
    # Priority: required in Debian, so /dev/tcp reaches the documented
    # introspection endpoint with no added package.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/4566 && printf 'GET /_fakecloud/health HTTP/1.0\r\n\r\n' >&3 &&
          grep -q '"status":"ok"' <&3
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
  primary:
    container_name: global-devcontainer-primary
    build:
      context: ./podman/psql-pub
      dockerfile: Containerfile
    # Wraps the stock postgres entrypoint so the replication role, the
    # replication slot, and pg_cron are (re)asserted on every start. They were
    # previously created from /docker-entrypoint-initdb.d, which runs only when
    # PGDATA is initialised, so `primary-data` volumes older than any of those
    # additions never received them.
    entrypoint: "/entrypoint.sh"
    command:
      - "-c"
      - config_file=/etc/postgresql/postgresql.conf
      - "-c"
      - hba_file=/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: development
      POSTGRES_DB: db
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: replication
      TZ: UTC
      POSTGRES_INITDB_WAL_LEVEL: replica
      POSTGRES_INITDB_MAX_WAL_SENDERS: 10
      POSTGRES_INITDB_MAX_REPLICATION_SLOTS: 10
    volumes:
      - primary-data:/var/lib/postgresql/data
      # `:z` adds an SELinux shared label so Fedora/RHEL hosts permit container
      # reads. Harmless on non-SELinux hosts (Arch, Ubuntu).
      - "./podman/psql-pub/entrypoint.sh:/entrypoint.sh:ro,z"
      - "./podman/psql-pub/postgresql.conf:/etc/postgresql/postgresql.conf:ro,z"
      - "./podman/psql-pub/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro,z"
    networks:
      - backend
    # Host-native Rails reaches PostgreSQL through loopback.
    ports:
      - "127.0.0.1:${POSTGRESQL_PRIMARY_HOST_PORT:-5432}:5432"
    # Bounded on purpose. Podman applies no backoff to a restart policy, so a service that
    # exits immediately on a bad configuration is recreated several times a second until
    # the netns, veth, conmon, and journald churn saturates a CPU. Five attempts ride out
    # a transient failure and leave a real misconfiguration stopped and visible.
    restart: on-failure:5
    # journald enforces no per-container size cap, and a restart loop writes the same
    # startup failure thousands of times, so a capped json-file driver is what actually
    # bounds the disk cost of a bad configuration. Container output no longer reaches
    # `journalctl`; read it with `podman logs`, which serves either driver.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # Also asserts the objects /entrypoint.sh provisions. `replica` gates its
      # pg_basebackup on this healthcheck, so without those two conditions it
      # can race ahead of provisioning, fail to authenticate, and burn its five
      # basebackup attempts before the role exists.
      test:
        - CMD-SHELL
        - export PGPASSWORD="$${POSTGRES_PASSWORD}" && pg_isready -U "$${POSTGRES_USER}" -d
          "$${POSTGRES_DB}" -h 127.0.0.1 && test "$$(psql -U "$${POSTGRES_USER}" -d
          "$${POSTGRES_DB}" -h 127.0.0.1 -Atqc 'SELECT pg_is_in_recovery()')" = f && test "$$(psql
          -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -h 127.0.0.1 -Atqc "SELECT count(*) FROM
          pg_roles WHERE rolname = '$${POSTGRES_REPLICATION_USER}' AND rolreplication")" = 1 && test
          "$$(psql -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -h 127.0.0.1 -Atqc "SELECT count(*)
          FROM pg_replication_slots WHERE slot_name = 'replication_slot_slave1'")" = 1
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
  replica:
    container_name: global-devcontainer-replica
    build:
      context: ./podman/psql-sub
      dockerfile: Containerfile
    entrypoint: "/entrypoint.sh"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: development
      POSTGRES_DB: db
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: replication
      TZ: UTC
    volumes:
      - replica-data:/var/lib/postgresql/data
      - "./podman/psql-sub/entrypoint.sh:/entrypoint.sh:ro,z"
      - "./podman/psql-sub/postgresql.conf:/etc/postgresql/postgresql.conf:ro,z"
      - "./podman/psql-sub/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro,z"
    depends_on:
      primary:
        condition: service_healthy
    networks:
      - backend
    # Host-native Rails reaches PostgreSQL through loopback.
    ports:
      - "127.0.0.1:${POSTGRESQL_REPLICA_HOST_PORT:-5433}:5432"
    # Bounded on purpose. Podman applies no backoff to a restart policy, so a service that
    # exits immediately on a bad configuration is recreated several times a second until
    # the netns, veth, conmon, and journald churn saturates a CPU. Five attempts ride out
    # a transient failure and leave a real misconfiguration stopped and visible.
    restart: on-failure:5
    # journald enforces no per-container size cap, and a restart loop writes the same
    # startup failure thousands of times, so a capped json-file driver is what actually
    # bounds the disk cost of a bad configuration. Container output no longer reaches
    # `journalctl`; read it with `podman logs`, which serves either driver.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # No backslash-escaped quotes: CMD-SHELL runs this under `sh -c`, where
      # `\"` is a literal quote rather than a nesting escape, and the whole
      # probe dies with `Syntax error: "(" unexpected` before it ever reaches
      # psql -- a check that can only fail, never pass. Plain double quotes
      # nest correctly inside "$(...)".
      test:
        - CMD-SHELL
        - export PGPASSWORD="$${POSTGRES_PASSWORD}" && pg_isready -U "$${POSTGRES_USER}" -d
          "$${POSTGRES_DB}" -h 127.0.0.1 && test "$$(psql -U "$${POSTGRES_USER}" -d
          "$${POSTGRES_DB}" -h 127.0.0.1 -Atqc 'SELECT pg_is_in_recovery()')" = t && test "$$(psql
          -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -h 127.0.0.1 -Atqc "SELECT count(*) > 0 FROM
          pg_stat_wal_receiver WHERE status = 'streaming'")" = t
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
  # Disposable, reconstructible application cache (Rails.cache). Every entry
  # One nonprod Valkey -- still one service, one volume, one port. Valkey's
  # default `databases 16` gives indexes 0-15, allocated as:
  #   0/1/2   dev  cache / rate-limit / auth-state
  #   3/4/5   test cache / rate-limit / auth-state
  #   6-10    unallocated, reserved for further application responsibilities
  #   11/12   dev  performance / coverband (diagnostic dashboards)
  #   13/14   test performance / coverband -- declared for validation only;
  #           nothing connects, both gems are `group :development`
  # The diagnostic pair sits at the top of the range deliberately, so adding an
  # application responsibility never has to renumber a dashboard.
  # Responsibility URLs remain mandatory; logical DBs are not a security
  # boundary (see adr/valkey-nonprod-logical-db-topology.md).
  valkey:
    container_name: global-devcontainer-valkey
    image: docker.io/valkey/valkey:8.0-alpine3.22
    networks:
      - backend
    ports:
      - "127.0.0.1:${VALKEY_HOST_PORT:-6379}:6379"
    volumes:
      - valkey-volume:/data
    restart: on-failure:5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - valkey-cli
        - ping
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 3s
  loki:
    container_name: global-devcontainer-loki
    image: docker.io/grafana/loki:3.7.7
    # Rootless podman creates named volumes as the host user. Running these
    # opt-in observability services as container root keeps their data
    # directories writable without changing host ownership.
    user: root
    command: "-config.file=/etc/loki/local-config.yaml"
    volumes:
      - loki-volume:/tmp/loki
    networks:
      - observability
    # Runs every session now that the observability group is no longer
    # profile-gated, so it recovers like the other always-on services. Bounded
    # because Podman applies no backoff; see compose_restart_policy_test.rb.
    restart: on-failure:5
    # journald enforces no per-container size cap, and a restart loop writes the
    # same startup failure thousands of times, so a capped json-file driver is
    # what bounds the disk cost of a bad configuration. Read it with
    # `podman logs`.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  tempo:
    container_name: global-devcontainer-tempo
    image: docker.io/grafana/tempo:2.10.5
    # See loki: rootless podman named-volume ownership needs the container
    # writer to map back to the host user.
    user: root
    command:
      - "-config.file=/etc/tempo.yaml"
    # No host port publication. Tempo's 3200/4317/4318/9411 are consumed only
    # on the `observability` network -- Grafana queries `tempo:3200` and the
    # collector exports to `tempo:4317` -- and Grafana itself publishes no host
    # port either, so nothing on the host ever dialed these.
    volumes:
      - "./podman/tempo/tempo.yaml:/etc/tempo.yaml:ro,z"
      - tempo-volume:/var/tempo
    networks:
      - observability
    # Runs every session now that the observability group is no longer
    # profile-gated, so it recovers like the other always-on services. Bounded
    # because Podman applies no backoff; see compose_restart_policy_test.rb.
    restart: on-failure:5
    # journald enforces no per-container size cap, and a restart loop writes the
    # same startup failure thousands of times, so a capped json-file driver is
    # what bounds the disk cost of a bad configuration. Read it with
    # `podman logs`.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  grafana:
    container_name: global-devcontainer-grafana
    image: docker.io/grafana/grafana:13.2.0
    # Grafana writes SQLite migrations under /var/lib/grafana; with rootless
    # podman the named volume can otherwise appear read-only to Grafana's UID.
    user: root
    environment:
      # Development-only, and read from the environment rather than committed as
      # a literal, per adr/traces-and-metrics-routing-via-alloy.md. Grafana
      # publishes no host port, so this guards a container-only UI.
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_PATHS_PROVISIONING: "/etc/grafana/provisioning"
    volumes:
      - grafana-volume:/var/lib/grafana
      - "./podman/grafana/provisioning:/etc/grafana/provisioning:z"
    networks:
      - observability
    depends_on:
      - loki
      - tempo
      - prometheus
    # Runs every session now that the observability group is no longer
    # profile-gated, so it recovers like the other always-on services. Bounded
    # because Podman applies no backoff; see compose_restart_policy_test.rb.
    restart: on-failure:5
    # journald enforces no per-container size cap, and a restart loop writes the
    # same startup failure thousands of times, so a capped json-file driver is
    # what bounds the disk cost of a bad configuration. Read it with
    # `podman logs`.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  # The single observability agent (adr/traces-and-metrics-routing-via-alloy.md).
  # Alloy is an OpenTelemetry Collector distribution with native Prometheus
  # pipelines, so it replaces both the former `otel-collector` service and the
  # Prometheus scrape job that pulled that collector's :8889 endpoint.
  alloy:
    container_name: global-devcontainer-alloy
    image: docker.io/grafana/alloy:v1.19.2
    # `run` is not the image default; the entrypoint expects the subcommand and
    # the config path. --storage.path is where Alloy keeps its WAL for
    # prometheus.remote_write; without it a restart loses buffered metrics.
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - "./podman/alloy/config.alloy:/etc/alloy/config.alloy:ro,z"
      - alloy-volume:/var/lib/alloy/data
    networks:
      - observability
    depends_on:
      - tempo
      - prometheus
    # Runs every session now that the observability group is no longer
    # profile-gated, so it recovers like the other always-on services. Bounded
    # because Podman applies no backoff; see compose_restart_policy_test.rb.
    restart: on-failure:5
    # journald enforces no per-container size cap, and a restart loop writes the
    # same startup failure thousands of times, so a capped json-file driver is
    # what bounds the disk cost of a bad configuration. Read it with
    # `podman logs`.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  prometheus:
    image: docker.io/prom/prometheus:v3.14.0
    # Prometheus writes its TSDB under /prometheus; keep rootless podman named
    # volumes writable under rootless podman.
    user: root
    # Overriding `command` drops the image's default flags, so the config and
    # TSDB paths have to be restated here.
    #
    # --web.enable-remote-write-receiver is required: Alloy pushes over
    # remote_write instead of being scraped, and Prometheus rejects those
    # requests without it.
    #
    # Retention is explicit because adr/traces-and-metrics-routing-via-alloy.md
    # treats an unbounded local volume as a misconfiguration. 24h matches the
    # Tempo block_retention in podman/tempo/tempo.yaml.
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=24h"
      - "--web.enable-remote-write-receiver"
    volumes:
      - "./podman/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z"
      - prometheus-volume:/prometheus
    networks:
      - observability
    # Runs every session now that the observability group is no longer
    # profile-gated, so it recovers like the other always-on services. Bounded
    # because Podman applies no backoff; see compose_restart_policy_test.rb.
    restart: on-failure:5
    # journald enforces no per-container size cap, and a restart loop writes the
    # same startup failure thousands of times, so a capped json-file driver is
    # what bounds the disk cost of a bad configuration. Read it with
    # `podman logs`.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  # The Cloudflare Tunnel connector. It lives here rather than in a local
  # override because the connector, its pinned release and its hardening are
  # project-wide facts; only the token is per-developer, and that arrives from
  # the gitignored `.env`.
  #
  # No `profiles:` on this service. The Dev Containers CLI starts every
  # unprofiled service in the merged Compose files, and the overlay is always
  # merged, so a profile here is what kept the sidecar from existing at all.
  # A missing token is not a clone-breaker: `:-` rather than `:?` so Compose
  # still interpolates, the process exits immediately, and `restart: on-failure:3`
  # leaves a stopped container instead of a restart storm.
  cloudflare-tunnel: &cloudflare-connector
    # Cloudflare supports cloudflared releases for one year. Keep this explicit tag current;
    # Workers VPC additionally requires 2025.7.0 or newer.
    image: docker.io/cloudflare/cloudflared:2026.8.2
    # No `depends_on: core`. Podman turns a Compose dependency into a container
    # dependency, and the Dev Containers CLI's `--remove-existing-container` then
    # fails on a bare `podman rm -f`.
    #
    # Workers VPC requires QUIC via `--protocol auto` or `quic`, and outbound UDP 7844.
    # Pinning `quic` disables the HTTP/2 fallback. After a sleep or UDP blip the
    # process can drain every connection and exit 0, which `restart: on-failure`
    # will not recreate. `auto` still prefers QUIC and falls back instead of exiting.
    # https://developers.cloudflare.com/workers-vpc/configuration/tunnel/
    # https://developers.cloudflare.com/cloudflare-one/networks/connectors/cloudflare-tunnel/configure-tunnels/run-parameters/#protocol
    #
    # `--no-autoupdate`: this image tag is the release we run. In-process updates
    # restart cloudflared without waiting for the replacement to connect.
    # https://developers.cloudflare.com/cloudflare-one/networks/connectors/cloudflare-tunnel/configure-tunnels/run-parameters/#autoupdate-freq
    #
    # TUNNEL_TOKEN identifies and authenticates the remotely managed tunnel, so no tunnel
    # name, cert.pem, credentials JSON, or browser-login helper is needed in this project.
    #
    # --metrics serves cloudflared's own /ready endpoint to the compose network, which is
    # what tells a connected tunnel apart from a restarting one -- a container id alone does
    # not. The transport probe in docs/operations/cloudflare-private-origin.md reads it, and
    # so does incident triage (notes/implementation/2026-08-23-cloudflare-tunnel-restart-storm.md).
    # It publishes no host port.
    command: tunnel --no-autoupdate --protocol auto --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARED_TOKEN:-}"
    # The private `*.localhost` Rails origins live on `frontend`; without it every
    # working ingress rule breaks.
    networks:
      - frontend
    # A connector that cannot identify its tunnel exits within milliseconds. Podman applies
    # no backoff to `unless-stopped`, so that turns into an unbounded restart storm which
    # saturates a CPU with netns, veth, conmon, and journald churn until someone notices.
    # Three attempts ride out a transient edge failure and keep a misconfiguration a
    # bounded, visible incident instead.
    restart: on-failure:3
    # Caps what a crash loop can consume before a human notices it.
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 128
    # journald enforces no per-container size cap, so a crash loop writing to it degrades
    # the whole host journal. Keep connector output in a bounded ring instead.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  # The same connector against the second remotely managed tunnel. The Cloudflare
  # account holds two development tunnels, and a connector can only run one, so
  # this is a second service rather than a switch on the first. The primary
  # connector starts with the stack; this one stays behind `--profile tunnel-edge`.
  #
  #   docker compose --profile tunnel-edge up -d   # CLOUDFLARED_EDGE_TOKEN
  #
  # Everything except the profile and the token is merged from the definition
  # above, so the pinned release, the protocol/metrics command, the `frontend`
  # attachment and the crash-loop caps cannot drift between the two.
  #
  # The primary connector and this profiled one may run together; they then serve
  # their own tunnels over the same private `*.localhost` origins.
  cloudflare-tunnel-edge:
    <<: *cloudflare-connector
    profiles:
      - tunnel-edge
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARED_EDGE_TOKEN:-}"
  # The connector for the dedicated Workers VPC tunnel `umaxica-dev-workers-vpc`
  # (`03a4a67c-2aca-4f2c-9aeb-d1666f18bc87`). It exists so the Workers VPC path does
  # not ride on `cloudflare-tunnel`'s tunnel, which also serves the ten published
  # browser hostnames behind Access: any ingress, replica, or token change there used
  # to move the Edge Worker's only route to Rails with it.
  #
  # Unlike the other two this tunnel carries NO ingress rules, no public hostname and
  # no Access application. Cloudflare routes Workers VPC traffic from the VPC Service
  # target rather than from tunnel ingress, so a locally managed tunnel needs no
  # ingress configuration at all.
  # https://developers.cloudflare.com/workers-vpc/configuration/tunnel/
  #
  # Everything else — the pinned release, `--protocol auto` for QUIC, the `frontend`
  # attachment that makes `core.app.localhost` resolve to `core`, and the crash-loop
  # caps — is merged from `cloudflare-tunnel` so it cannot drift.
  #
  # No profile: the Workers VPC path is part of the standard development environment,
  # so `devcontainer up` and a plain `up` both start it. A missing token leaves a
  # stopped container, exactly as it does for the other two connectors.
  cloudflare-tunnel-workers-vpc:
    <<: *cloudflare-connector
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARED_WORKERS_VPC_TOKEN:-}"
networks:
  backend: {}
  frontend: {}
  observability: {}
  outer:
    name: "${OUTER_DOCKER_NETWORK:-umaxica-apps-global_outer}"
    # Keep this network Compose-managed. Interpolating `external` produces a
    # string, which podman-compose cannot safely treat as the boolean required
    # by the Compose model and causes `up` to fail while building network args.
    external: false
  # `cloudflare-tunnel` attaches to `frontend`; see the service definition.
  # See docs/operations/cloudflare-private-origin.md.
volumes:
  fakecloud-data: {}
  primary-data: {}
  replica-data: {}
  valkey-volume: {}
  alloy-volume: {}
  loki-volume: {}
  tempo-volume: {}
  grafana-volume: {}
  prometheus-volume: {}
