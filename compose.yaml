---
# The COMPLETE standard development environment. A fresh `git clone` plus a
# container engine must be enough to resolve this configuration and to open the
# Dev Container — no local file has to be created first. Nothing here may use a
# required `${VAR:?}` interpolation: Compose interpolates the whole file
# whichever service is named, so one would stop every machine that has not set
# the variable, even for a service it never starts.
#
# The file layout:
#
#   compose.yaml                  — this file. Everything every developer and the
#                                   Dev Container needs, including the workspace
#                                   bind mount and the loopback host publications.
#   .devcontainer/compose.override.yml
#                                 — TRACKED. The Dev Container's own overlay
#                                   (container names, SELinux labels, ports). Part
#                                   of the standard environment, not a local file.
#   compose.override.yaml         — OPTIONAL, gitignored, per developer/machine.
#                                   Never created automatically; documented by
#                                   `compose.override.yaml.example`.
#   compose.remote-access.yaml    — opt-in, tracked, never in `dockerComposeFile`.
#
# `.devcontainer/devcontainer.json` loads the first two, in that order. The Dev
# Containers CLI passes each entry to Compose as `-f`, which also suppresses
# Compose's auto-discovery of `compose.override.yaml` — so a local override
# applies to a bare `docker compose`, not to the editor.
#
# The `-dc` suffix is historical and is kept deliberately: the project name is the
# prefix of every named volume, so changing it would orphan the development
# PostgreSQL, Valkey, bundle, and node_modules volumes.
name: umaxica-apps-global-dc
services:
  core:
    container_name: global-devcontainer-core
    build:
      context: "."
      dockerfile: "./Containerfile"
      # `development` is the normal image. Set CORE_BUILD_TARGET=workspace in the
      # repository-local `.env` to build the nested-rootless-Podman `workspace`
      # stage instead; that stage additionally needs a `/dev/fuse` device entry,
      # which is host-shaped and therefore belongs in your own, optional
      # `compose.override.yaml` (see `compose.override.yaml.example`).
      # See docs/operations/development-container-targets.md.
      target: "${CORE_BUILD_TARGET:-development}"
      args:
        COMMIT_HASH: abcdef
        # Host-shaped, but parameterized, so they stay project-common. `$UID`/`$GID`
        # are bash builtins rather than exported variables, so Compose sees real
        # values only when the gitignored repository-root `.env` carries `UID=`
        # and `GID=` lines. Write them by hand once per machine; see
        # docs/operations/development-credential-provisioning.md.
        DOCKER_UID: "${UID:-1000}"
        DOCKER_GID: "${GID:-1000}"
    # `keep-id` maps the host user directly to the workload UID/GID baked into the
    # image (DOCKER_UID/DOCKER_GID above), so bind-mounted repo files keep host
    # ownership. No `user:` key: rootless Podman's keep-id handling silently
    # overrides an explicit `user:` anyway, and core-entrypoint runs the workload
    # directly (no chown, no setpriv drop) when it is already started as the
    # keep-id-mapped workload UID.
    userns_mode: keep-id
    tty: true
    stdin_open: true
    # core-entrypoint `exec`s the command, so without this PID 1 is `sleep infinity`, which
    # never calls wait(). Every process orphaned inside the container -- editor servers, agent
    # processes, `git`, test runs killed mid-flight -- then stays a zombie for the life of the
    # container, and this one is deliberately long-lived. Measured on 2026-08-30: 80 zombies
    # after 22 hours of uptime, accumulating at ~3.7/hour against a 2048 pids limit. `init: true`
    # puts a reaping init (catatonit under Podman) at PID 1 and leaves the entrypoint its child.
    init: true
    entrypoint:
      - "/usr/local/bin/core-entrypoint"
    # The container stays up idle; start the Rails/Vite/jobs stack manually
    # with `bin/dev` inside the container when it is wanted.
    command:
      - sleep
      - infinity
    environment:
      # The datastores run on UTC; keep the app container consistent with them.
      # A host `/etc/timezone` bind mount is not portable: the file is a Debian
      # convention and does not exist on Fedora/RHEL hosts, where the missing
      # source made the whole container fail to create.
      TZ: UTC
      # Pinned here as well as in the image (Containerfile, `development-base`), because
      # anything that rebuilds the container environment rather than inheriting PID 1's
      # -- a different build target, a base image change -- otherwise leaves Ruby at
      # Encoding.default_external US-ASCII, where reading any non-ASCII source raises
      # `invalid byte sequence in US-ASCII` from tests that only scan files.
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      # --- Ruby / Bundler ---
      RUBY_PATH: /usr/local/bin/ruby
      BUNDLE_PATH: vendor/bundle
      # --- Rails server ---
      BRAND_NAME: UMAXICA
      PORT: "3000"
      BINDING: "0.0.0.0"
      # `alloy` is no longer profile-gated, so it is always there to receive.
      # Leaving this "false" would run the whole collection stack while Rails
      # itself emitted nothing.
      OPEN_TELEMETRY: "true"
      NODE_ENV: development
      # --- PostgreSQL credentials ---
      # Fixed literals, not generated secrets. This stack is development-only,
      # every database it serves is disposable, and nothing here is reachable
      # off the host, so a value the whole team can read from the file it is
      # written in is worth more than a random one nobody can look up. Keep
      # these three identical to the `primary` and `replica` values below;
      # PostgreSQL bakes the password into `primary-data` at initdb time, so a
      # mismatch locks the stack out of its own volume.
      POSTGRESQL_USER: root
      POSTGRESQL_PASSWORD: development
      POSTGRESQL_DATABASE: db
      # --- Identifier HMAC salts (dev-only fixed values; differ from production) ---
      EMAIL_ADDRESS_HMAC_SALT: "${EMAIL_ADDRESS_HMAC_SALT:-development_email_address_hmac_salt}"
      TELEPHONE_NUMBER_HMAC_SALT: "${TELEPHONE_NUMBER_HMAC_SALT:-development_telephone_number_hmac_salt}"
      # --- Unified Enforcement identifier HMAC keys (adr/unified-enforcement.md,
      #     D6) -- dedicated per-realm keys, deliberately distinct from the
      #     credential-lookup salts above; dev-only fixed values, differ from
      #     production. ---
      ENFORCEMENT_APP_IDENTIFIER_HMAC_KEY: "${ENFORCEMENT_APP_IDENTIFIER_HMAC_KEY:-development_enforcement_app_identifier_hmac_key}"
      ENFORCEMENT_COM_IDENTIFIER_HMAC_KEY: "${ENFORCEMENT_COM_IDENTIFIER_HMAC_KEY:-development_enforcement_com_identifier_hmac_key}"
      ENFORCEMENT_ORG_IDENTIFIER_HMAC_KEY: "${ENFORCEMENT_ORG_IDENTIFIER_HMAC_KEY:-development_enforcement_org_identifier_hmac_key}"
      # --- PostgreSQL topology ---
      # One `_PUB` (writer) and one `_SUB` (reader) entry per development
      # database in config/database.yml, which reads them with one-argument
      # ENV.fetch: a name missing here fails the boot instead of silently
      # routing that database at the default host. `platform` has no replica
      # entry, so it is writer-only. Keep this list in step with the
      # `development:` block of config/database.yml.
      POSTGRESQL_HOST: primary
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_APP_ZENITH_PUB: primary
      POSTGRESQL_APP_ZENITH_SUB: replica
      POSTGRESQL_ORG_ZENITH_PUB: primary
      POSTGRESQL_ORG_ZENITH_SUB: replica
      POSTGRESQL_COM_ZENITH_PUB: primary
      POSTGRESQL_COM_ZENITH_SUB: replica
      POSTGRESQL_APP_SETTING_PUB: primary
      POSTGRESQL_APP_SETTING_SUB: replica
      POSTGRESQL_ORG_SETTING_PUB: primary
      POSTGRESQL_ORG_SETTING_SUB: replica
      POSTGRESQL_COM_SETTING_PUB: primary
      POSTGRESQL_COM_SETTING_SUB: replica
      POSTGRESQL_APP_TICKET_PUB: primary
      POSTGRESQL_APP_TICKET_SUB: replica
      POSTGRESQL_ORG_TICKET_PUB: primary
      POSTGRESQL_ORG_TICKET_SUB: replica
      POSTGRESQL_COM_TICKET_PUB: primary
      POSTGRESQL_COM_TICKET_SUB: replica
      POSTGRESQL_APP_SIGNAL_PUB: primary
      POSTGRESQL_APP_SIGNAL_SUB: replica
      POSTGRESQL_ORG_SIGNAL_PUB: primary
      POSTGRESQL_ORG_SIGNAL_SUB: replica
      POSTGRESQL_COM_SIGNAL_PUB: primary
      POSTGRESQL_COM_SIGNAL_SUB: replica
      POSTGRESQL_AVATAR_PUB: primary
      POSTGRESQL_AVATAR_SUB: replica
      POSTGRESQL_CHRONICLE_PUB: primary
      POSTGRESQL_CHRONICLE_SUB: replica
      POSTGRESQL_OCCURRENCE_PUB: primary
      POSTGRESQL_OCCURRENCE_SUB: replica
      POSTGRESQL_PUBLISHING_PUB: primary
      POSTGRESQL_PUBLISHING_SUB: replica
      POSTGRESQL_QUEUE_PUB: primary
      POSTGRESQL_QUEUE_SUB: replica
      POSTGRESQL_SEARCH_PUB: primary
      POSTGRESQL_SEARCH_SUB: replica
      POSTGRESQL_STORAGE_PUB: primary
      POSTGRESQL_STORAGE_SUB: replica
      POSTGRESQL_PLATFORM_PUB: primary
      # --- Valkey ---
      # Two services, not two logical database indexes on one. The stores have
      # different lifetimes and different blast radiuses: flushing the cache to
      # reproduce a stale-JWKS bug must not also reset every rate-limit window,
      # and restarting either must not take the other down. A shared container
      # with /0 and /1 makes both of those one `FLUSHALL` or one restart away.
      #
      # Neither is authoritative. Losing the cache costs a refetch; losing the
      # counters resets the current windows. Anything whose loss would change
      # correctness, security, or history is in PostgreSQL.
      CACHE_REDIS_URL: "redis://valkey-cache:6379/0"
      RATE_LIMIT_REDIS_URL: "redis://valkey-rate-limit:6379/0"
      # Credentials for the Flipper UI mounted on the developer surface. The mount
      # is wrapped in Rack::Auth::Basic (config/routes/base.rb) and fails closed
      # when these are unset, so local development needs them to reach the UI.
      # Development values only: production supplies them through credentials.
      FLIPPER_UI_USER: "${FLIPPER_UI_USER:-flipper}"
      FLIPPER_UI_PASSWORD: "${FLIPPER_UI_PASSWORD:-development_flipper_password}"
      # --- Observability ---
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy:4318"
      # --- Mail ---
      AWS_SES_REGION: ap-northeast-1
      # --- Object storage (fakecloud S3) ---
      OBJECT_STORAGE_ENDPOINT: "http://fakecloud:4566"
      OBJECT_STORAGE_REGION: "us-east-1"
      # Fixed development bucket name, like the endpoint and region above. It is
      # not host-shaped and not a credential, so it belongs in the service
      # contract rather than in the repository-root .env.
      OBJECT_STORAGE_BUCKET: umaxica-local
      # fakecloud validates the shape of a SigV4 signature but never the key
      # material, so these are not secrets and the former Podman-secret machinery
      # bought nothing. Literal, obviously-fake values are the point: a real AWS
      # access key appearing here is visible on sight rather than hidden behind a
      # generated /run/secrets file. Production takes no key from these variables
      # at all -- it uses the AWS SDK default credential chain and rejects
      # OBJECT_STORAGE_ENDPOINT outright (lib/object_storage_shrine_configuration.rb).
      OBJECT_STORAGE_ACCESS_KEY_ID: "test"
      OBJECT_STORAGE_SECRET_ACCESS_KEY: "test"
      OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
      PUBLIC_AUTH_CORPORATE_URL: auth.umaxica.com
      PUBLIC_AUTH_SERVICE_URL: auth.umaxica.app
      PUBLIC_AUTH_STAFF_URL: auth.umaxica.org
      PUBLIC_BASE_CORPORATE_URL: www.umaxica.com
      PUBLIC_BASE_SERVICE_URL: www.umaxica.app
      PUBLIC_BASE_STAFF_URL: www.umaxica.org
      PUBLIC_BASE_DEVELOPER_URL: www.umaxica.dev
      PUBLIC_SIDE_CORPORATE_URL: side-jp.umaxica.com
      PUBLIC_SIDE_SERVICE_URL: side-jp.umaxica.app
      PUBLIC_SIDE_STAFF_URL: side-jp.umaxica.org
      PUBLIC_CORE_CORPORATE_URL: jp.umaxica.com
      PUBLIC_CORE_SERVICE_URL: jp.umaxica.app
      PUBLIC_CORE_STAFF_URL: jp.umaxica.org
      PUBLIC_PALM_SERVICE_URL: palm-jp.umaxica.app
      PUBLIC_INFO_CORPORATE_URL: info.umaxica.com
      PUBLIC_INFO_SERVICE_URL: info.umaxica.app
      PUBLIC_INFO_STAFF_URL: info.umaxica.org
      PUBLIC_DOCS_CORPORATE_URL: docs.com.localhost
      PUBLIC_DOCS_SERVICE_URL: docs.app.localhost
      PUBLIC_DOCS_STAFF_URL: docs.org.localhost
      PUBLIC_EDGE_CORPORATE_URL: edge.com.localhost
      PUBLIC_EDGE_SERVICE_URL: edge.app.localhost
      PUBLIC_EDGE_STAFF_URL: edge.org.localhost
      PUBLIC_JUMP_GATEWAY_URL: jump.umaxica.net
      PUBLIC_STATUS_URL: status.umaxica.dev
      PUBLIC_ASSET_URL: asset.umaxica.net
      # --- Private origins (pod-internal / tunnel) ---
      PRIVATE_AUTH_CORPORATE_URL: auth.com.localhost
      PRIVATE_AUTH_SERVICE_URL: auth.app.localhost
      PRIVATE_AUTH_STAFF_URL: auth.org.localhost
      PRIVATE_BASE_CORPORATE_URL: base.com.localhost
      PRIVATE_BASE_SERVICE_URL: base.app.localhost
      PRIVATE_BASE_STAFF_URL: base.org.localhost
      PRIVATE_BASE_NETWORK_URL: base.net.localhost
      PRIVATE_BASE_DEVELOPER_URL: base.dev.localhost
      PRIVATE_CORE_CORPORATE_URL: core.com.localhost
      PRIVATE_CORE_SERVICE_URL: core.app.localhost
      PRIVATE_CORE_STAFF_URL: core.org.localhost
      PRIVATE_DOCS_CORPORATE_URL: docs.com.localhost
      PRIVATE_DOCS_SERVICE_URL: docs.app.localhost
      PRIVATE_DOCS_STAFF_URL: docs.org.localhost
      PRIVATE_HELP_CORPORATE_URL: help.com.localhost
      PRIVATE_HELP_SERVICE_URL: help.app.localhost
      PRIVATE_HELP_STAFF_URL: help.org.localhost
      PRIVATE_INFO_CORPORATE_URL: info.com.localhost
      PRIVATE_INFO_SERVICE_URL: info.app.localhost
      PRIVATE_INFO_STAFF_URL: info.org.localhost
      PRIVATE_NEWS_CORPORATE_URL: news.com.localhost
      PRIVATE_NEWS_SERVICE_URL: news.app.localhost
      PRIVATE_NEWS_STAFF_URL: news.org.localhost
      PRIVATE_PALM_SERVICE_URL: palm.app.localhost
      # --- External authentication ceremony availability ---
      # Now runtime Flipper features (:social_ceremony_apple / _google / _entra) stored in
      # the `platform` PostgreSQL database. Enable them with `bin/rails social_ceremony:enable[apple]`.
      # --- JWT leeway ---
      PREFERENCE_JWT_LEEWAY_SECONDS: "30"
      AUTH_JWT_LEEWAY_SECONDS: "30"
      AUTH_JWT_CLIENT_AUDIENCES: umaxica-api-client
      AUTH_JWT_VISITOR_AUDIENCES: umaxica-api-visitor
      AUTH_JWT_OPERATOR_AUDIENCES: umaxica-api-operator
      # --- Vite ---
      VITE_RUBY_PACKAGE_MANAGER: pnpm
      VITE_RUBY_HOST: "0.0.0.0"
      VITE_RUBY_PORT: "3036"
      VITE_GIT_HOOKS: "0"
      # --- pnpm ---
      # Pin the store instead of letting pnpm resolve it: node_modules lives on its
      # own named volume, so pnpm's default resolution falls back to a workspace-local
      # .pnpm-store, which conflicts with the store vite-ruby's own pnpm calls used and
      # fails every session with ERR_PNPM_UNEXPECTED_STORE.
      npm_config_store_dir: /home/global/.local/share/pnpm/store
      TMPDIR: /home/global/workspace/tmp
      DEVCONTAINER: "1"
      RUBY_DEBUG_OPEN: "false"
    # Bounded on purpose. Podman applies no backoff to a restart policy, so a service that
    # exits immediately on a bad configuration is recreated several times a second until
    # the netns, veth, conmon, and journald churn saturates a CPU; the attempt count is
    # the only bound Compose can express. `core` ran unbounded `always` until the budget
    # was made uniform. The trade-off: `on-failure` containers are not restored after a
    # host reboot or logout, because podman-restart.service starts only containers whose
    # policy is `always` or `unless-stopped`. Reopening the Dev Container brings the stack
    # back, so what is lost is a convenience rather than a data path.
    restart: on-failure:5
    # journald enforces no per-container size cap, and a restart loop writes the same
    # startup failure thousands of times, so a capped json-file driver is what actually
    # bounds the disk cost of a bad configuration. Container output no longer reaches
    # `journalctl`; read it with `podman logs`, which serves either driver.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Named volumes for high-write paths prevent rootless podman UID-mapping
    # from rewriting host file ownership on the bind-mounted workspace:
    #   - umaxica-home-cache  → pnpm / Vite / YJIT scratch
    #   - umaxica-home-share  → pnpm store (~/.local/share/pnpm only)
    #   - umaxica-node-modules → workspace node_modules (off the repo tree)
    #   - umaxica-bundle       → vendor/bundle (off the repo tree)
    # Discard any of these with `podman volume rm <name>` to recover from
    # a corrupted cache without affecting credentials or workspace state.
    volumes:
      # Relative paths in Compose files resolve against the project directory (the
      # directory holding the first `-f` file), so `.` is the repository root.
      # `:Z` adds an SELinux private label on Fedora/RHEL hosts and is harmless on
      # non-SELinux hosts (Arch, Ubuntu).
      - type: bind
        source: "."
        target: "/home/global/workspace"
        bind:
          selinux: Z
      # The Dev Container string-form `readonly` mounts are writable with the
      # current rootless Podman provider. Keep host configuration and guarded
      # workspace paths in Compose long syntax so the effective mount flags stay
      # inspectable. The host SSH directory is intentionally absent: nothing in
      # this container needs host private keys.
      - type: bind
        source: "./.github"
        target: "/home/global/workspace/.github"
        read_only: true
        bind:
          selinux: Z
      - type: bind
        source: "./bin"
        target: "/home/global/workspace/bin"
        read_only: true
        bind:
          selinux: Z
      - type: bind
        source: "./.devcontainer"
        target: "/home/global/workspace/.devcontainer"
        read_only: true
        bind:
          selinux: Z
      - type: volume
        source: umaxica-home-cache
        target: "/home/global/.cache"
      # Mounted at the pnpm subdirectory, not at .local/share itself. The
      # Claude Code devcontainer feature installs through claude.ai/install.sh,
      # which lands its versions under ~/.local/share/claude at *build* time; a
      # volume over the whole .local/share shadows that at run time and leaves
      # ~/.local/bin/claude a dangling symlink.
      - type: volume
        source: umaxica-home-share
        target: "/home/global/.local/share/pnpm"
      - type: volume
        source: umaxica-node-modules
        target: "/home/global/workspace/node_modules"
      - type: volume
        source: umaxica-bundle
        target: "/home/global/workspace/vendor/bundle"
      # Storage for the nested rootless Podman of the `workspace` build target.
      # Inert on the `development` target, which has no inner Podman; keeping the
      # mount here means CORE_BUILD_TARGET=workspace needs no extra volume wiring.
      - type: volume
        source: workspace-podman-storage
        target: "/home/global/.local/share/containers"
    # Loopback-only host publication. `BINDING: 0.0.0.0` above is the
    # *container-side* listener and must stay: cloudflare-tunnel and the probe
    # containers reach Rails over the `frontend` network, not through the host.
    # The two are separate decisions
    # (docs/operations/development-host-port-exposure.md).
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3036:3036"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      backend: {}
      frontend:
        aliases:
          # Private pod-internal / tunnel origins (PRIVATE_*_URL). The Cloudflare
          # Tunnel ingress rules resolve their `service:` address on this network,
          # so these names must resolve to `core` here. Without them cloudflared
          # falls back to loopback and every proxied request fails with
          # `dial tcp [::1]:3000: connect: connection refused`.
          - base.app.localhost
          - base.com.localhost
          - base.org.localhost
          - base.net.localhost
          - base.dev.localhost
          - auth.app.localhost
          - auth.com.localhost
          - auth.org.localhost
          - core.app.localhost
          - core.com.localhost
          - core.org.localhost
          - docs.app.localhost
          - docs.com.localhost
          - docs.org.localhost
          - help.app.localhost
          - help.com.localhost
          - help.org.localhost
          - news.app.localhost
          - news.com.localhost
          - news.org.localhost
          - palm.app.localhost
          - side.app.localhost
          - side.com.localhost
          - side.org.localhost
          - edge.app.localhost
          - edge.com.localhost
          - edge.org.localhost
          - info.app.localhost
          - info.com.localhost
          - info.org.localhost
          # Browser-facing site names (PUBLIC_*_URL). Development is published through
          # Cloudflare Tunnel behind Cloudflare Access, and a Tunnel ingress rule resolves
          # its `service:` address on this network, so the published names have to resolve
          # to `core` here. Only Umaxica-owned names belong in this list.
          # See docs/architecture/cloudflare-request-paths.md.
          - auth.umaxica.com
          - auth.umaxica.org
          - auth.umaxica.app
          - www.umaxica.app
          - www.umaxica.com
          - www.umaxica.org
          - www.umaxica.dev
          - jp.umaxica.app
          - jp.umaxica.com
          - jp.umaxica.org
          - jp.umaxica.dev
          - us.umaxica.app
          - us.umaxica.com
          - us.umaxica.org
          - us.umaxica.dev
          - side-jp.umaxica.app
          - side-jp.umaxica.com
          - side-jp.umaxica.org
          - side-us.umaxica.app
          - side-us.umaxica.com
          - side-us.umaxica.org
          - palm-jp.umaxica.app
          - palm-us.umaxica.app
      observability: {}
      outer:
        aliases:
          - global
    depends_on:
      primary:
        condition: service_healthy
      replica:
        condition: service_started
      valkey-cache:
        condition: service_healthy
      valkey-rate-limit:
        condition: service_healthy
  # Local AWS emulator. This is the project-common AWS compatibility layer for
  # development: S3 and the MSK control plane are reached here instead of
  # through a per-service emulator. It is deliberately not profile-gated, so a
  # plain `up` gives every developer the same AWS surface without extra flags.
  #
  # No container socket is mounted. fakecloud can back a provisioned MSK cluster
  # with a real sibling Kafka broker, but only if it is handed a Docker/Podman
  # socket, which would grant this container full container-management rights
  # under the invoking user. Without one it serves the MSK control plane with the
  # same response shapes, which is what the Terraform resources exercise. Kafka produce/consume
  # is therefore out of scope; see docs/operations/local-aws-fakecloud.md.
  fakecloud:
    # Pinned by digest, not by version: the upstream registry publishes only
    # `latest`, `main`, and `sha-<commit>` tags, so there is no semver tag to
    # track. Dependabot's docker ecosystem updates the digest on this form.
    image: ghcr.io/faiscadev/fakecloud:latest@sha256:48b0a8b3f0ee14d0d71f704954e1d2c6b48b88fab67468dd85beb633b33f7dc9
    hostname: fakecloud
    environment:
      # Without this fakecloud keeps every bucket and object in memory, so a
      # restart silently discards local state. Persisting to the named volume
      # below makes `down` keep state and `down -v` discard it.
      FAKECLOUD_STORAGE_MODE: persistent
      FAKECLOUD_DATA_PATH: /var/lib/fakecloud
      FAKECLOUD_LOG: info
    volumes:
      - fakecloud-data:/var/lib/fakecloud
    networks:
      - backend
    # Loopback-only publication so Terraform and the AWS CLI can run from the
    # host, the same reason the former RustFS service published 9000. fakecloud
    # is not a datastore, so this does not weaken the never-publish rule in
    # docs/operations/development-host-port-exposure.md.
    ports:
      - "127.0.0.1:${FAKECLOUD_HOST_PORT:-4566}:4566"
    # Bounded on purpose. Podman applies no backoff to `unless-stopped`, so a
    # service that exits immediately on a bad configuration is recreated several
    # times a second until the netns, veth, conmon, and journald churn saturates
    # a CPU. Three attempts ride out a transient failure and leave a real
    # misconfiguration stopped and visible.
    restart: on-failure:3
    # journald enforces no per-container size cap, and a restart loop writes the same
    # startup failure thousands of times, so a capped json-file driver is what actually
    # bounds the disk cost of a bad configuration. Read it with `podman logs`.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # The upstream image is Debian bookworm carrying only ca-certificates,
    # nftables, kmod, and procps -- it has no curl and no wget, so the health
    # probe published in fakecloud's own docs cannot run here. bash is
    # Priority: required in Debian, so /dev/tcp reaches the documented
    # introspection endpoint with no added package.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/4566 && printf 'GET /_fakecloud/health HTTP/1.0\r\n\r\n' >&3 &&
          grep -q '"status":"ok"' <&3
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
  primary:
    container_name: global-devcontainer-primary
    build:
      context: ./podman/psql-pub
      dockerfile: Containerfile
    # Wraps the stock postgres entrypoint so the replication role, the
    # replication slot, and pg_cron are (re)asserted on every start. They were
    # previously created from /docker-entrypoint-initdb.d, which runs only when
    # PGDATA is initialised, so `primary-data` volumes older than any of those
    # additions never received them.
    entrypoint: "/entrypoint.sh"
    command:
      - "-c"
      - config_file=/etc/postgresql/postgresql.conf
      - "-c"
      - hba_file=/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: development
      POSTGRES_DB: db
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: replication
      TZ: UTC
      POSTGRES_INITDB_WAL_LEVEL: replica
      POSTGRES_INITDB_MAX_WAL_SENDERS: 10
      POSTGRES_INITDB_MAX_REPLICATION_SLOTS: 10
    volumes:
      - primary-data:/var/lib/postgresql/data
      # `:z` adds an SELinux shared label so Fedora/RHEL hosts permit container
      # reads. Harmless on non-SELinux hosts (Arch, Ubuntu).
      - "./podman/psql-pub/entrypoint.sh:/entrypoint.sh:ro,z"
      - "./podman/psql-pub/postgresql.conf:/etc/postgresql/postgresql.conf:ro,z"
      - "./podman/psql-pub/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro,z"
    networks:
      - backend
    # Bounded on purpose. Podman applies no backoff to a restart policy, so a service that
    # exits immediately on a bad configuration is recreated several times a second until
    # the netns, veth, conmon, and journald churn saturates a CPU. Five attempts ride out
    # a transient failure and leave a real misconfiguration stopped and visible.
    restart: on-failure:5
    # journald enforces no per-container size cap, and a restart loop writes the same
    # startup failure thousands of times, so a capped json-file driver is what actually
    # bounds the disk cost of a bad configuration. Container output no longer reaches
    # `journalctl`; read it with `podman logs`, which serves either driver.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # Also asserts the objects /entrypoint.sh provisions. `replica` gates its
      # pg_basebackup on this healthcheck, so without those two conditions it
      # can race ahead of provisioning, fail to authenticate, and burn its five
      # basebackup attempts before the role exists.
      test:
        - CMD-SHELL
        - export PGPASSWORD="$${POSTGRES_PASSWORD}" && pg_isready -U "$${POSTGRES_USER}" -d
          "$${POSTGRES_DB}" -h 127.0.0.1 && test "$$(psql -U "$${POSTGRES_USER}" -d
          "$${POSTGRES_DB}" -h 127.0.0.1 -Atqc 'SELECT pg_is_in_recovery()')" = f && test "$$(psql
          -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -h 127.0.0.1 -Atqc "SELECT count(*) FROM
          pg_roles WHERE rolname = '$${POSTGRES_REPLICATION_USER}' AND rolreplication")" = 1 && test
          "$$(psql -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -h 127.0.0.1 -Atqc "SELECT count(*)
          FROM pg_replication_slots WHERE slot_name = 'replication_slot_slave1'")" = 1
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
  replica:
    container_name: global-devcontainer-replica
    build:
      context: ./podman/psql-sub
      dockerfile: Containerfile
    entrypoint: "/entrypoint.sh"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: development
      POSTGRES_DB: db
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: replication
      TZ: UTC
    volumes:
      - replica-data:/var/lib/postgresql/data
      - "./podman/psql-sub/entrypoint.sh:/entrypoint.sh:ro,z"
      - "./podman/psql-sub/postgresql.conf:/etc/postgresql/postgresql.conf:ro,z"
      - "./podman/psql-sub/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro,z"
    depends_on:
      primary:
        condition: service_healthy
    networks:
      - backend
    # Bounded on purpose. Podman applies no backoff to a restart policy, so a service that
    # exits immediately on a bad configuration is recreated several times a second until
    # the netns, veth, conmon, and journald churn saturates a CPU. Five attempts ride out
    # a transient failure and leave a real misconfiguration stopped and visible.
    restart: on-failure:5
    # journald enforces no per-container size cap, and a restart loop writes the same
    # startup failure thousands of times, so a capped json-file driver is what actually
    # bounds the disk cost of a bad configuration. Container output no longer reaches
    # `journalctl`; read it with `podman logs`, which serves either driver.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # No backslash-escaped quotes: CMD-SHELL runs this under `sh -c`, where
      # `\"` is a literal quote rather than a nesting escape, and the whole
      # probe dies with `Syntax error: "(" unexpected` before it ever reaches
      # psql -- a check that can only fail, never pass. Plain double quotes
      # nest correctly inside "$(...)".
      test:
        - CMD-SHELL
        - export PGPASSWORD="$${POSTGRES_PASSWORD}" && pg_isready -U "$${POSTGRES_USER}" -d
          "$${POSTGRES_DB}" -h 127.0.0.1 && test "$$(psql -U "$${POSTGRES_USER}" -d
          "$${POSTGRES_DB}" -h 127.0.0.1 -Atqc 'SELECT pg_is_in_recovery()')" = t && test "$$(psql
          -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -h 127.0.0.1 -Atqc "SELECT count(*) > 0 FROM
          pg_stat_wal_receiver WHERE status = 'streaming'")" = t
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
  valkey-cache:
    container_name: global-devcontainer-valkey-cache
    image: docker.io/valkey/valkey:8.0-alpine3.22
    # Rails.cache (CACHE_REDIS_URL). Reconstructible entries with explicit TTLs;
    # safe to flush at any time -- every entry refetches from its source.
    networks:
      - backend
    volumes:
      - valkey-cache-volume:/data
    # Bounded on purpose. Podman applies no backoff to a restart policy, so a service that
    # exits immediately on a bad configuration is recreated several times a second until
    # the netns, veth, conmon, and journald churn saturates a CPU. Five attempts ride out
    # a transient failure and leave a real misconfiguration stopped and visible.
    restart: on-failure:5
    # journald enforces no per-container size cap, and a restart loop writes the same
    # startup failure thousands of times, so a capped json-file driver is what actually
    # bounds the disk cost of a bad configuration. Container output no longer reaches
    # `journalctl`; read it with `podman logs`, which serves either driver.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - valkey-cli
        - ping
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 3s
  valkey-rate-limit:
    container_name: global-devcontainer-valkey-rate-limit
    image: docker.io/valkey/valkey:8.0-alpine3.22
    # config.x.rate_limit.store (RATE_LIMIT_REDIS_URL). Counters keyed by client,
    # expiring with their window. Flushing resets windows, nothing else.
    networks:
      - backend
    volumes:
      - valkey-rate-limit-volume:/data
    # Bounded on purpose. Podman applies no backoff to a restart policy, so a service that
    # exits immediately on a bad configuration is recreated several times a second until
    # the netns, veth, conmon, and journald churn saturates a CPU. Five attempts ride out
    # a transient failure and leave a real misconfiguration stopped and visible.
    restart: on-failure:5
    # journald enforces no per-container size cap, and a restart loop writes the same
    # startup failure thousands of times, so a capped json-file driver is what actually
    # bounds the disk cost of a bad configuration. Container output no longer reaches
    # `journalctl`; read it with `podman logs`, which serves either driver.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - valkey-cli
        - ping
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 3s
  loki:
    container_name: global-devcontainer-loki
    image: docker.io/grafana/loki:3.7.7
    # Rootless podman creates named volumes as the host user. Running these
    # opt-in observability services as container root keeps their data
    # directories writable without changing host ownership.
    user: root
    command: "-config.file=/etc/loki/local-config.yaml"
    volumes:
      - loki-volume:/tmp/loki
    networks:
      - observability
    # Runs every session now that the observability group is no longer
    # profile-gated, so it recovers like the other always-on services. Bounded
    # because Podman applies no backoff; see compose_restart_policy_test.rb.
    restart: on-failure:5
    # journald enforces no per-container size cap, and a restart loop writes the
    # same startup failure thousands of times, so a capped json-file driver is
    # what bounds the disk cost of a bad configuration. Read it with
    # `podman logs`.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  tempo:
    container_name: global-devcontainer-tempo
    image: docker.io/grafana/tempo:2.10.5
    # See loki: rootless podman named-volume ownership needs the container
    # writer to map back to the host user.
    user: root
    command:
      - "-config.file=/etc/tempo.yaml"
    # No host port publication. Tempo's 3200/4317/4318/9411 are consumed only
    # on the `observability` network -- Grafana queries `tempo:3200` and the
    # collector exports to `tempo:4317` -- and Grafana itself publishes no host
    # port either, so nothing on the host ever dialed these.
    volumes:
      - "./podman/tempo/tempo.yaml:/etc/tempo.yaml:ro,z"
      - tempo-volume:/var/tempo
    networks:
      - observability
    # Runs every session now that the observability group is no longer
    # profile-gated, so it recovers like the other always-on services. Bounded
    # because Podman applies no backoff; see compose_restart_policy_test.rb.
    restart: on-failure:5
    # journald enforces no per-container size cap, and a restart loop writes the
    # same startup failure thousands of times, so a capped json-file driver is
    # what bounds the disk cost of a bad configuration. Read it with
    # `podman logs`.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  grafana:
    container_name: global-devcontainer-grafana
    image: docker.io/grafana/grafana:13.2.0
    # Grafana writes SQLite migrations under /var/lib/grafana; with rootless
    # podman the named volume can otherwise appear read-only to Grafana's UID.
    user: root
    environment:
      # Development-only, and read from the environment rather than committed as
      # a literal, per adr/traces-and-metrics-routing-via-alloy.md. Grafana
      # publishes no host port, so this guards a container-only UI.
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_PATHS_PROVISIONING: "/etc/grafana/provisioning"
    volumes:
      - grafana-volume:/var/lib/grafana
      - "./podman/grafana/provisioning:/etc/grafana/provisioning:z"
    networks:
      - observability
    depends_on:
      - loki
      - tempo
      - prometheus
    # Runs every session now that the observability group is no longer
    # profile-gated, so it recovers like the other always-on services. Bounded
    # because Podman applies no backoff; see compose_restart_policy_test.rb.
    restart: on-failure:5
    # journald enforces no per-container size cap, and a restart loop writes the
    # same startup failure thousands of times, so a capped json-file driver is
    # what bounds the disk cost of a bad configuration. Read it with
    # `podman logs`.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  # The single observability agent (adr/traces-and-metrics-routing-via-alloy.md).
  # Alloy is an OpenTelemetry Collector distribution with native Prometheus
  # pipelines, so it replaces both the former `otel-collector` service and the
  # Prometheus scrape job that pulled that collector's :8889 endpoint.
  alloy:
    container_name: global-devcontainer-alloy
    image: docker.io/grafana/alloy:v1.19.2
    # `run` is not the image default; the entrypoint expects the subcommand and
    # the config path. --storage.path is where Alloy keeps its WAL for
    # prometheus.remote_write; without it a restart loses buffered metrics.
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - "./podman/alloy/config.alloy:/etc/alloy/config.alloy:ro,z"
      - alloy-volume:/var/lib/alloy/data
    networks:
      - observability
    depends_on:
      - tempo
      - prometheus
    # Runs every session now that the observability group is no longer
    # profile-gated, so it recovers like the other always-on services. Bounded
    # because Podman applies no backoff; see compose_restart_policy_test.rb.
    restart: on-failure:5
    # journald enforces no per-container size cap, and a restart loop writes the
    # same startup failure thousands of times, so a capped json-file driver is
    # what bounds the disk cost of a bad configuration. Read it with
    # `podman logs`.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  prometheus:
    image: docker.io/prom/prometheus:v3.14.0
    # Prometheus writes its TSDB under /prometheus; keep rootless podman named
    # volumes writable under rootless podman.
    user: root
    # Overriding `command` drops the image's default flags, so the config and
    # TSDB paths have to be restated here.
    #
    # --web.enable-remote-write-receiver is required: Alloy pushes over
    # remote_write instead of being scraped, and Prometheus rejects those
    # requests without it.
    #
    # Retention is explicit because adr/traces-and-metrics-routing-via-alloy.md
    # treats an unbounded local volume as a misconfiguration. 24h matches the
    # Tempo block_retention in podman/tempo/tempo.yaml.
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=24h"
      - "--web.enable-remote-write-receiver"
    volumes:
      - "./podman/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z"
      - prometheus-volume:/prometheus
    networks:
      - observability
    # Runs every session now that the observability group is no longer
    # profile-gated, so it recovers like the other always-on services. Bounded
    # because Podman applies no backoff; see compose_restart_policy_test.rb.
    restart: on-failure:5
    # journald enforces no per-container size cap, and a restart loop writes the
    # same startup failure thousands of times, so a capped json-file driver is
    # what bounds the disk cost of a bad configuration. Read it with
    # `podman logs`.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  # The Cloudflare Tunnel connector. It lives here rather than in a local
  # override because the connector, its pinned release and its hardening are
  # project-wide facts; only the token is per-developer, and that arrives from
  # the gitignored `.env`.
  #
  # No `profiles:` on this service. The Dev Containers CLI starts every
  # unprofiled service in the merged Compose files, and the overlay is always
  # merged, so a profile here is what kept the sidecar from existing at all.
  # A missing token is not a clone-breaker: `:-` rather than `:?` so Compose
  # still interpolates, the process exits immediately, and `restart: on-failure:3`
  # leaves a stopped container instead of a restart storm.
  cloudflare-tunnel: &cloudflare-connector
    # Cloudflare supports cloudflared releases for one year. Keep this explicit tag current;
    # Workers VPC additionally requires 2025.7.0 or newer.
    image: docker.io/cloudflare/cloudflared:2026.8.2
    # No `depends_on: core`. Podman turns a Compose dependency into a container
    # dependency, and the Dev Containers CLI's `--remove-existing-container` then
    # fails on a bare `podman rm -f`.
    #
    # Workers VPC requires QUIC via `--protocol auto` or `quic`, and outbound UDP 7844.
    # Pinning `quic` disables the HTTP/2 fallback. After a sleep or UDP blip the
    # process can drain every connection and exit 0, which `restart: on-failure`
    # will not recreate. `auto` still prefers QUIC and falls back instead of exiting.
    # https://developers.cloudflare.com/workers-vpc/configuration/tunnel/
    # https://developers.cloudflare.com/cloudflare-one/networks/connectors/cloudflare-tunnel/configure-tunnels/run-parameters/#protocol
    #
    # `--no-autoupdate`: this image tag is the release we run. In-process updates
    # restart cloudflared without waiting for the replacement to connect.
    # https://developers.cloudflare.com/cloudflare-one/networks/connectors/cloudflare-tunnel/configure-tunnels/run-parameters/#autoupdate-freq
    #
    # TUNNEL_TOKEN identifies and authenticates the remotely managed tunnel, so no tunnel
    # name, cert.pem, credentials JSON, or browser-login helper is needed in this project.
    #
    # --metrics serves cloudflared's own /ready endpoint to the compose network, which is
    # what tells a connected tunnel apart from a restarting one -- a container id alone does
    # not. The transport probe in docs/operations/cloudflare-private-origin.md reads it, and
    # so does incident triage (notes/implementation/2026-08-23-cloudflare-tunnel-restart-storm.md).
    # It publishes no host port.
    command: tunnel --no-autoupdate --protocol auto --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARED_TOKEN:-}"
    # The private `*.localhost` Rails origins live on `frontend`; without it every
    # working ingress rule breaks.
    networks:
      - frontend
    # A connector that cannot identify its tunnel exits within milliseconds. Podman applies
    # no backoff to `unless-stopped`, so that turns into an unbounded restart storm which
    # saturates a CPU with netns, veth, conmon, and journald churn until someone notices.
    # Three attempts ride out a transient edge failure and keep a misconfiguration a
    # bounded, visible incident instead.
    restart: on-failure:3
    # Caps what a crash loop can consume before a human notices it.
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 128
    # journald enforces no per-container size cap, so a crash loop writing to it degrades
    # the whole host journal. Keep connector output in a bounded ring instead.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  # The same connector against the second remotely managed tunnel. The Cloudflare
  # account holds two development tunnels, and a connector can only run one, so
  # this is a second service rather than a switch on the first. The primary
  # connector starts with the stack; this one stays behind `--profile tunnel-edge`.
  #
  #   docker compose --profile tunnel-edge up -d   # CLOUDFLARED_EDGE_TOKEN
  #
  # Everything except the profile and the token is merged from the definition
  # above, so the pinned release, the protocol/metrics command, the `frontend`
  # attachment and the crash-loop caps cannot drift between the two.
  #
  # The primary connector and this profiled one may run together; they then serve
  # their own tunnels over the same private `*.localhost` origins.
  cloudflare-tunnel-edge:
    <<: *cloudflare-connector
    profiles:
      - tunnel-edge
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARED_EDGE_TOKEN:-}"
networks:
  backend: {}
  frontend: {}
  observability: {}
  outer:
    name: "${OUTER_DOCKER_NETWORK:-umaxica-apps-global_outer}"
    # Keep this network Compose-managed. Interpolating `external` produces a
    # string, which podman-compose cannot safely treat as the boolean required
    # by the Compose model and causes `up` to fail while building network args.
    external: false
  # `cloudflare-tunnel` attaches to `frontend`; see the service definition.
  # See docs/operations/cloudflare-private-origin.md.
volumes:
  fakecloud-data: {}
  primary-data: {}
  workspace-podman-storage: {}
  replica-data: {}
  valkey-cache-volume: {}
  valkey-rate-limit-volume: {}
  alloy-volume: {}
  loki-volume: {}
  tempo-volume: {}
  grafana-volume: {}
  prometheus-volume: {}
  umaxica-home-cache: {}
  umaxica-home-share: {}
  umaxica-node-modules: {}
  umaxica-bundle: {}
