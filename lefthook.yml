pre-commit:
  parallel: true
  jobs:
    - name: oxfmt
      glob:
        - "*.{js,jsx,ts,tsx,json,jsonc,css,scss,md,yml,yaml}"
      exclude:
        # ERB-templated Rails config; oxfmt's YAML parser cannot handle the
        # embedded <% %> tags and misreads them as YAML syntax errors.
        - "config/database.yml"
        # Generated by `bun run openapi:bundle`; Redocly owns the formatting.
        - "openapi/bundled/openapi*.yml"
      run: bun x oxfmt {staged_files}
      stage_fixed: true

    - name: oxlint
      glob:
        - "*.{js,jsx,ts,tsx}"
      run: bun x oxlint --fix {staged_files}
      stage_fixed: true

    - name: rubocop
      glob:
        - "*.{rb,rake}"
      run: bundle exec rubocop -a --force-exclusion {staged_files}
      stage_fixed: true

    # A template with unbalanced ERB blocks only fails when its action renders,
    # and Brakeman skips files it cannot parse instead of reporting on them.
    # Compile every template so a structural break is caught at commit time.
    - name: erb-compiles
      glob:
        - "app/views/**/*.erb"
      run: bin/rails test test/unit/views/template_compilation_test.rb

pre-push:
  parallel: false
  jobs:
    - name: frontend-check
      run: bun run ci
