# Shared component definitions for every surface description.
#
# This file is not a valid OpenAPI document on its own. It is referenced from
# openapi/{app,com,org}.yml and from openapi/shared/paths/*.yml, and Redocly CLI
# bundles it into public/openapi.{app,com,org}.yml.
#
# Rules that apply to everything here, from
# adr/api-versioning-and-client-conventions.md section 4 as amended 2026-08-22:
#   - Target OpenAPI 3.0.4.
#   - Never set additionalProperties: false. Clients must tolerate unknown response fields.
#   - No internal host names, internal route names, or non-public operational detail.

securitySchemes:
  coreBrowserCookie:
    type: apiKey
    in: cookie
    name: __Host-auth_access
    description: >-
      First-party HttpOnly access cookie. The `__Host-` prefix is present in any secure context; the
      basename alone (`auth_access`) is used otherwise. Unsafe methods additionally require
      `X-CSRF-Token`, which OpenAPI cannot express as part of a security scheme; it is declared as a
      required header parameter instead. Requests that also carry an `Authorization` header are
      rejected: an endpoint accepts exactly one credential transport.

  bearerToken:
    type: http
    scheme: bearer
    bearerFormat: JWT
    description: >-
      Native client access token. Requests that also carry a `Cookie` header are rejected: an
      endpoint accepts exactly one credential transport.

parameters:
  CsrfToken:
    name: X-CSRF-Token
    in: header
    required: true
    schema:
      type: string
    description: >-
      CSRF token obtained from `GET /api/v0/session`. Required on every unsafe method. OpenAPI has
      no security scheme for a double-submit CSRF token in any version, so it is described here as
      an ordinary required header.

  Limit:
    name: limit
    in: query
    description: >-
      Page size, 1 to 100, defaulting to 20. A value outside the bounds is clamped rather than
      refused, so a tuning mistake cannot become an error. A value that is not a whole number is a
      malformed request and is refused with 400.
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20

  Cursor:
    name: cursor
    in: query
    description: >-
      Opaque continuation token from a previous response's `page.next_cursor`. Pass it back
      verbatim. A cursor that does not verify is refused with 400 rather than silently answering
      with the first page.
    schema:
      type: string

  IfNoneMatch:
    name: If-None-Match
    in: header
    description: Prior `ETag`. A match answers `304` with no body (RFC 9110 13.1.2).
    schema:
      type: string

  IfModifiedSince:
    name: If-Modified-Since
    in: header
    description: Prior `Last-Modified`. RFC 9110 13.1.3.
    schema:
      type: string

responses:
  Problem:
    description: An RFC 9457 problem document.
    content:
      application/problem+json:
        schema:
          $ref: "#/schemas/Problem"

  NotAcceptable:
    description: >-
      The request `Accept` excludes both `application/json` and `application/problem+json`. The
      refusal is still sent as a problem document (RFC 9110 15.5.7).
    content:
      application/problem+json:
        schema:
          $ref: "#/schemas/Problem"

  UnsupportedMediaType:
    description: The request carries a body whose `Content-Type` is not `application/json`.
    content:
      application/problem+json:
        schema:
          $ref: "#/schemas/Problem"

  RateLimited:
    description: A rate limit was exceeded.
    headers:
      Retry-After:
        description: >-
          Seconds to wait before retrying. This is the authoritative retry signal; the RateLimit
          header is informational and may be absent, and no client behaviour may depend on it.
        schema:
          type: integer
      RateLimit:
        schema:
          type: string
          example: '"default";r=0;t=60'
    content:
      application/problem+json:
        schema:
          $ref: "#/schemas/Problem"

schemas:
  Problem:
    type: object
    description: >-
      RFC 9457 Problem Details. This repository defines exactly two extension members, `request_id`
      and `errors`; see docs/reference/api-design-standards.md.
    required: [type, title, status, request_id]
    properties:
      type:
        type: string
        format: uri
        description: >-
          Stable problem identifier. Branch on this value, never on title or detail. Clients must
          not dereference it (RFC 9457 3.1.1). The registry is closed and enforced in code by
          `ProblemType`, which raises on an unregistered slug.
        enum:
          - urn:umaxica:problem:bad-request
          - urn:umaxica:problem:authentication-required
          - urn:umaxica:problem:token-expired
          - urn:umaxica:problem:authorization-denied
          - urn:umaxica:problem:csrf-verification-failed
          - urn:umaxica:problem:not-found
          - urn:umaxica:problem:method-not-allowed
          - urn:umaxica:problem:not-acceptable
          - urn:umaxica:problem:unsupported-media-type
          - urn:umaxica:problem:validation-failed
          - urn:umaxica:problem:rate-limited
          - urn:umaxica:problem:server-error
          - urn:umaxica:problem:service-unavailable
      title:
        type: string
        description: Stable summary of the type. Not for programmatic use.
      status:
        type: integer
        description: Duplicates the HTTP status code and always agrees with it.
      detail:
        type: string
        description: Occurrence-specific explanation for a human. Absent when there is none.
      instance:
        type: string
        description: Path identifying this occurrence.
      request_id:
        type: string
        description: Request correlation identifier. Always present.
      errors:
        type: array
        description: Field-level validation problems. Present only on 422.
        items:
          type: object
          required: [pointer, type]
          properties:
            pointer:
              type: string
              description: RFC 6901 JSON Pointer into the request body.
            type:
              type: string
              format: uri
            detail:
              type: string

  SessionSummary:
    type: object
    required: [authenticated, csrf_token]
    properties:
      authenticated:
        type: boolean
      csrf_token:
        type: string
        description: Required as `X-CSRF-Token` on unsafe requests to this surface.
      actor:
        type: object
        description: Present only when authenticated.
        required: [id, display_name]
        properties:
          id:
            type: string
            description: Public identifier. Never a database primary key.
          display_name:
            type: string

  Actor:
    type: object
    required: [type, id]
    properties:
      type:
        type: string
        example: client
      id:
        type: string
        description: Public identifier. Never a database primary key.

  Entry:
    type: object
    description: One published entry, rendered from its frozen published version.
    required:
      [
        public_id,
        namespace,
        surface,
        slug,
        locale,
        title,
        summary,
        body,
        published_at,
        updated_at,
        snapshot_public_id,
        taxonomy,
      ]
    properties:
      public_id:
        type: string
        description: >-
          Opaque entry identifier and the resource identity for
          `GET /api/v0/entries/{public_id}`. Never a database primary key and not
          the slug. Treat as an opaque string; its generation scheme is not part
          of the contract.
      namespace:
        type: string
        description: Content service.
        enum: [docs, help, news, info]
      surface:
        type: string
        description: Audience.
        enum: [app, com, org]
      slug:
        type: string
        nullable: true
        description: >-
          The canonical slug. Always present as a member; the value is null when the entry has no
          canonical slug row, which `PublishingEntrySerializer#canonical_slug` guards for.
      locale:
        type: string
        example: ja
      title:
        type: string
      summary:
        type: string
        nullable: true
        description: >-
          Always present as a member; the value may be null. `publishing_entry_versions.summary` is
          the only nullable column behind this schema.
      body:
        type: object
        description: >-
          Always a structured object, never a bare string. Consumers may rely on the type.
        additionalProperties: true
      published_at:
        type: string
        format: date-time
        description: >-
          RFC 3339 instant with an explicit `Z` offset. Never null. `PublishingEntrySerializer#call`
          returns nothing at all when there is no active publication, and
          `publishing_publications.effective_from` is `NOT NULL`, so an entry that renders always
          has one. It was previously described as nullable, which described a state that cannot
          occur.
      updated_at:
        type: string
        format: date-time
        description: RFC 3339 instant of the published version row. Used for Last-Modified.
      snapshot_public_id:
        type: string
        description: Stable public identifier of the published snapshot used for HTML validators.
      taxonomy:
        type: object
        description: >-
          Keyed by vocabulary key for this audience and service. A single-valued vocabulary renders
          one object or null; a multi-valued vocabulary renders an ordered array.
        additionalProperties: true

  Page:
    type: object
    description: >-
      Collection page metadata (adr/api-collection-contract.md). `has_more` is authoritative;
      `next_cursor` is null whenever it is false.
    required: [next_cursor, has_more]
    properties:
      next_cursor:
        type: string
        nullable: true
        description: >-
          Opaque continuation token. It is signed, so it cannot be constructed by a client, and it
          carries no database primary key. Its encoding may change without a version bump; a client
          must pass it back verbatim and must not parse it.
      has_more:
        type: boolean

  CheckStatus:
    type: object
    description: One check's verdict in the machine-readable health aggregate.
    required: [status]
    properties:
      status:
        type: string
        enum: [pass, warn, fail]

  HealthReport:
    type: object
    description: >-
      Machine-readable health aggregate for `GET /api/v0/health.json`. See
      docs/reference/health-endpoints.md. Carries only the two enum-bounded strings `status`
      and `checks.*.status`; no internal topology, hostname, dependency name, exception, path,
      or environment value crosses this boundary.
    required: [status, checks]
    properties:
      status:
        type: string
        description: >-
          Worst of the three checks. `fail` is served with HTTP 503; `pass` and `warn` with 200.
        enum: [pass, warn, fail]
      checks:
        type: object
        description: >-
          Per-check verdicts, mapped independently so a readiness failure never changes the
          dependency-free liveness verdict.
        required: [startup, liveness, readiness]
        properties:
          startup:
            $ref: "#/schemas/CheckStatus"
          liveness:
            $ref: "#/schemas/CheckStatus"
          readiness:
            $ref: "#/schemas/CheckStatus"

  Revision:
    type: object
    description: >-
      Machine-readable deployment revision for `GET /api/v0/revision.json`.
    required: [revision]
    properties:
      revision:
        type: string
        nullable: true
        description: >-
          The framework-resolved deployment revision (`Rails.application.revision`). Always
          present as a member; the value is `null` when no revision is configured, which is a
          normal state. Never a fabricated identifier.
