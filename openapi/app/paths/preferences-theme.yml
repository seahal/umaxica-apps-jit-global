# GET and PATCH /api/v0/preferences/theme on the app surface.
servers:
  - url: https://jp.umaxica.app
    description: Core public host for the app (end-user application) surface.
  - url: https://www.umaxica.app
    description: Base public host for the app (end-user application) surface.
  - url: https://auth.umaxica.app
    description: Auth public host for the app (end-user application) surface.
  - url: https://www-jp.umaxica.app
    description: Warp public host for the app (end-user application) surface.
get:
  summary: Current color theme
  description: >-
    Reports the caller's color theme. No session is required. Served host-locally by each listed host: each host reads and writes its own host-only preference credentials, and a browser calls only its current origin.
  operationId: getPreferencesTheme
  tags: [Preferences]
  security: []
  responses:
    "200":
      description: Current theme code.
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: "../../shared/components.yml#/schemas/ColorTheme"
    "406":
      $ref: "../../shared/components.yml#/responses/NotAcceptable"
    "429":
      $ref: "../../shared/components.yml#/responses/RateLimited"
patch:
  summary: Update color theme
  description: >-
    Writes the color theme cookie (and the preference record when a preference token is present).
    `theme` is `light`, `dark`, or `system` (case-insensitive) or a stored code; any other value,
    including a missing member, is a 422 with the pointer `/theme`. Unknown members are ignored.
  operationId: patchPreferencesTheme
  tags: [Preferences]
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [theme]
          properties:
            theme:
              type: string
              enum: [light, dark, system, li, dr, sy]
  responses:
    "200":
      description: Theme after the write.
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: "../../shared/components.yml#/schemas/ColorTheme"
    "400":
      $ref: "../../shared/components.yml#/responses/BadRequest"
    "401":
      $ref: "../../shared/components.yml#/responses/ForeignPreferenceToken"
    "403":
      $ref: "../../shared/components.yml#/responses/CsrfVerificationFailed"
    "406":
      $ref: "../../shared/components.yml#/responses/NotAcceptable"
    "415":
      $ref: "../../shared/components.yml#/responses/UnsupportedMediaType"
    "422":
      $ref: "../../shared/components.yml#/responses/ValidationFailed"
    "429":
      $ref: "../../shared/components.yml#/responses/RateLimited"
