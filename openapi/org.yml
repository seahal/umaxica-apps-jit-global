  /api/v0/health.json:
    $ref: "shared/paths/api-v0-health.yml"

  /api/v0/revision.json:
    $ref: "shared/paths/api-v0-revision.yml"

  /api/v0/session:
    $ref: "org/paths/session.yml"

  /api/v0/token/refresh:
    $ref: "org/paths/token-refresh.yml"

  /api/v0/entries:
    $ref: "shared/paths/entries.yml"

  /api/v0/entries/{public_id}:
    $ref: "shared/paths/entry.yml"

components:
  securitySchemes:
    coreBrowserCookie:
      $ref: "shared/components.yml#/securitySchemes/coreBrowserCookie"
