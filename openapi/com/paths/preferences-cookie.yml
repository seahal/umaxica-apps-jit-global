# GET and PATCH /api/v0/preferences/cookie on the com surface.
servers:
  - url: https://jp.umaxica.com
    description: Core public host for the com (public and corporate) surface.
  - url: https://www.umaxica.com
    description: Base public host for the com (public and corporate) surface.
  - url: https://auth.umaxica.com
    description: Auth public host for the com (public and corporate) surface.
  - url: https://www-jp.umaxica.com
    description: Warp public host for the com (public and corporate) surface.
get:
  summary: Cookie-consent banner state
  description: >-
    Reports whether the cookie-consent banner should be shown. Open: no session is required.
    Served host-locally by each listed host: each host reads and writes its own host-only preference credentials, and a browser calls only its current origin.
  operationId: getPreferencesCookie
  tags: [Preferences]
  security: []
  responses:
    "200":
      description: Banner visibility for this caller.
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: "../../shared/components.yml#/schemas/CookieBanner"
    "406":
      $ref: "../../shared/components.yml#/responses/NotAcceptable"
    "429":
      $ref: "../../shared/components.yml#/responses/RateLimited"
patch:
  summary: Record cookie consent
  description: >-
    Records a cookie-consent decision. Open: a caller without a preference token records the
    decision in the consent buffer only. `cookie.consented` is required; each present flag must be
    a boolean or one of `1`, `0`, `"1"`, `"0"`, `"true"`, `"false"`, `"t"`, `"f"` (and the
    upper-case forms), otherwise the request is a 422 naming each field. Successful writes have no
    representation.
  operationId: patchPreferencesCookie
  tags: [Preferences]
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [cookie]
          properties:
            cookie:
              type: object
              required: [consented]
              properties:
                consented: {}
                functional: {}
                performant: {}
                targetable: {}
  responses:
    "204":
      description: Consent recorded. No body (RFC 9110 15.3.5).
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
    "400":
      $ref: "../../shared/components.yml#/responses/BadRequest"
    "401":
      $ref: "../../shared/components.yml#/responses/ForeignPreferenceToken"
    "403":
      $ref: "../../shared/components.yml#/responses/CsrfVerificationFailed"
    "406":
      $ref: "../../shared/components.yml#/responses/NotAcceptable"
    "415":
      $ref: "../../shared/components.yml#/responses/UnsupportedMediaType"
    "422":
      $ref: "../../shared/components.yml#/responses/ValidationFailed"
    "429":
      $ref: "../../shared/components.yml#/responses/RateLimited"
