# GET and PATCH /api/v0/preferences/cookie on the com surface.
servers:
  - url: https://www.umaxica.com
    description: Base public host for the com (public and corporate) surface.
get:
  summary: Cookie-consent banner state
  description: >-
    Reports whether the cookie-consent banner should be shown. Open: no session is required.
    A same-TLD preference token and a matching host-only browser binding identify a recorded decision.
  operationId: getPreferencesCookie
  tags: [Preferences]
  security: []
  responses:
    "200":
      description: Banner visibility for this caller.
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: "../../shared/components.yml#/schemas/CookieBanner"
    "400":
      description: Ambiguous duplicate preference cookies were rejected without a response body.
    "406":
      $ref: "../../shared/components.yml#/responses/NotAcceptable"
    "429":
      $ref: "../../shared/components.yml#/responses/RateLimited"
patch:
  summary: Record cookie consent
  description: >-
    Records a cookie-consent decision. Open: a caller without a valid preference token receives a
    new preference. Either `consented` or `cookie.consented` is required; each present flag must be
    a boolean or one of `1`, `0`, `"1"`, `"0"`, `"true"`, `"false"`, `"t"`, `"f"` (and the
    upper-case forms), otherwise the request is a 422 naming each field.
  operationId: patchPreferencesCookie
  tags: [Preferences]
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          anyOf:
            - required: [consented]
            - required: [cookie]
          properties:
            consented: {}
            cookie:
              type: object
              required: [consented]
              properties:
                consented: {}
                functional: {}
                performant: {}
                targetable: {}
  responses:
    "200":
      description: Recorded consent choices.
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            type: object
            required: [cookie]
            properties:
              cookie:
                type: object
                required: [consented, functional, performant, targetable]
                properties:
                  consented: { type: boolean }
                  functional: { type: boolean }
                  performant: { type: boolean }
                  targetable: { type: boolean }
    "400":
      description: Malformed JSON or ambiguous duplicate preference cookies.
      content:
        application/problem+json:
          schema:
            $ref: "../../shared/components.yml#/schemas/Problem"
    "403":
      description: CSRF verification failed or the browser binding did not match.
      content:
        application/problem+json:
          schema:
            $ref: "../../shared/components.yml#/schemas/Problem"
    "406":
      $ref: "../../shared/components.yml#/responses/NotAcceptable"
    "415":
      $ref: "../../shared/components.yml#/responses/UnsupportedMediaType"
    "422":
      $ref: "../../shared/components.yml#/responses/ValidationFailed"
    "429":
      $ref: "../../shared/components.yml#/responses/RateLimited"
    "503":
      $ref: "../../shared/components.yml#/responses/Problem"
