openapi: 3.0.4
info:
  title: Umaxica JSON API (com surface)
  version: "0"
  contact:
    name: API Support
  description: |
    Machine-facing JSON endpoints served under `/api/v0` on the **com** surface, including the
    machine-readable health and revision endpoints.

    The `app`, `com`, and `org` surfaces are independent trust boundaries served on separate
    hosts, so each has its own description. This one covers the public and corporate surface. An
    endpoint described here exists on this surface's own hosts; it is never shared across surfaces.

    ## What is absent, and why

    Endpoints whose wire format is fixed by another specification -- OAuth 2.0, OIDC, WebAuthn,
    DBSC, MCP (JSON-RPC 2.0), and `.well-known` resources -- are intentionally absent. They are
    governed by their own specifications, not by this contract. The DBSC registration endpoint
    is under `/api/v0/preferences/dbsc` but remains undescribed here because DBSC has its own
    specification. The remaining legacy `/edge/v0` and `/web/v0` endpoints stay absent until they
    converge (adr/api-route-vocabulary-consolidation.md).

    ## Preferences

    `/api/v0/preferences/{cookie,theme,web_push}` is a browser API served by Base on this
    surface, listed in the path's `servers`. Base uses a same-TLD preference token and a host-only browser binding for consent and Web Push;
    a browser calls only the origin it is on; the endpoints are not for cross-origin
    use. The com surface is anonymous: Auth, Core, and Warp serve no preference API on com hosts.

    The text operational endpoints -- `GET /health`, `GET /health/{startup,liveness,readiness}`,
    and `GET /revision` -- are absent because they are not JSON: they render `text/plain` and do
    not negotiate. Only the machine-readable `/api/v0/health.json` and `/api/v0/revision.json`
    endpoints are described here.

    ## Hosts

    `servers` appears only where a host is real, public, and knowable from the repository. The
    preference paths list every host that serves them. The health and revision endpoints carry none
    because they are blocked at the edge. The content and Palm paths carry none because their hosts
    are supplied by deployment environment variables, and the docs and news content editions have no
    production host at all.

    ## Errors

    Most errors use RFC 9457 Problem Details (`application/problem+json`). Duplicate preference
    cookie names are rejected with an empty 400 response. Problem `type` values are
    the stable identifiers clients branch on; `title` and `detail` are human-readable and may
    change. Two extension members are defined: `request_id` and `errors`.

    Some `/api/v0` error responses currently also carry a transitional `error` member that is
    deliberately not described here. It has no known consumer and is scheduled for removal
    (decision D6 in research/rails-nextjs-openapi-contract-audit.md). No schema in this description
    sets `additionalProperties: false`, so clients must tolerate it and any other unknown member.

tags:
  - name: Health
    description: >-
      Machine-readable health aggregate and deployment revision. Blocked at the edge, JSON only.
  - name: Preferences
    description: Cookie-consent, color-theme and Web Push JSON endpoints under `/api/v0/preferences`.
  - name: Content
    description: Read-only published documentation, help, news, and info entries.

