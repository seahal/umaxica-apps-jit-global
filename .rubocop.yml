inherit_from:
  - .rubocop/rubocop_ast.yml
  - .rubocop/umaxica.yml
  - .rubocop_todo.yml

# ============================================================
# RuboCop Configuration
# ============================================================
# このファイルはRubyコードの静的解析とフォーマットを設定します
#
# 設定カテゴリ:
# 1. 基本設定（AllCops, Plugins, Inheritance）
# 2. レイアウト・フォーマット（Layout, Style）
# 3. コード品質（Metrics, Lint）
# 4. セキュリティ（Security）
# 5. フレームワーク固有（Rails）
# 6. パフォーマンス（Performance）
# 7. テスト（Minitest）
# 8. その他（Rake, I18n, Naming）

Style/DisableCopsWithinSourceCodeDirective:
  Enabled: false

# ============================================================
# 1. 基本設定
# ============================================================

inherit_gem:
  rubocop-rails-omakase: rubocop.yml

# プラグイン
plugins:
  - rubocop-performance
  - rubocop-thread_safety
  - rubocop-rake
  - rubocop-minitest
  - rubocop-i18n
  - rubocop-rubycw
  - rubocop-rails

# 全Copに適用される設定
AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  UseProjectIndex: true
  SuggestExtensions: false
  UseCache: true
  CacheRootDirectory: tmp/rubocop_cache
  Exclude:
    - "vendor/**/*"
    - "node_modules/**/*"
    - "db/schema.rb"
    - "db/*_schema.rb"
    - "db/**/*_migrate/**/*.rb"
    - "bin/**/*"
    - "tmp/**/*"
    - "log/**/*"
    - "**/*.md"
  Include:
    - "**/*.rb"
    - "**/*.rake"
    - "**/Gemfile"
    - "**/Rakefile"

# ============================================================
# 2. レイアウト・フォーマット
# ============================================================

Layout:
  Enabled: true

# ------------------------------------------------------------
# Controller: enforced structure
# ------------------------------------------------------------
Layout/ClassStructure:
  Enabled: true
  Include:
    - app/controllers/**/*.rb
  Categories:
    module_inclusion:
      - include
      - prepend
      - extend
    constants:
      - CONSTANT
    macros:
      - layout
      - respond_to
      - helper
      - helper_method
      - before_action
      - after_action
      - around_action
      - skip_before_action
      - skip_after_action
      - skip_around_action
    public_class_methods:
      - public_class_method
    initializer:
      - initialize
    public_methods:
      - public_method
    protected_methods:
      - protected_method
    private_methods:
      - private_method
  ExpectedOrder:
    - module_inclusion
    - constants
    - macros
    - public_class_methods
    - initializer
    - public_methods
    - protected_methods
    - private_methods

Style/AccessorGrouping:
  Enabled: true

# ---------- インデント ----------
Layout/IndentationWidth:
  Enabled: true
  Width: 2

Layout/IndentationConsistency:
  Enabled: true
  EnforcedStyle: normal

Layout/IndentationStyle:
  Enabled: true
  EnforcedStyle: spaces

Layout/EndAlignment:
  Enabled: true
  EnforcedStyleAlignWith: variable

# ---------- 空行 ----------
Layout/EmptyLinesAroundBlockBody:
  Enabled: true
  EnforcedStyle: no_empty_lines

Layout/EmptyLinesAroundClassBody:
  Enabled: true
  EnforcedStyle: no_empty_lines

Layout/EmptyLinesAroundModuleBody:
  Enabled: true
  EnforcedStyle: no_empty_lines

Layout/EmptyLinesAroundMethodBody:
  Enabled: true
  Include:
    - app/controllers/**/*.rb

Layout/EmptyLinesAroundAccessModifier:
  Enabled: true
  Include:
    - app/controllers/**/*.rb

Layout/EmptyLineAfterGuardClause:
  Enabled: true

Layout/EmptyLineAfterMagicComment:
  Enabled: true

# Controller-friendly access modifier spacing
Style/AccessModifierDeclarations:
  Enabled: true
  EnforcedStyle: group

# メソッド間の空行を強制（1行の空行を要求）
Layout/EmptyLineBetweenDefs:
  Enabled: true
  AllowAdjacentOneLineDefs: false
  NumberOfEmptyLines: 1

# 複数の連続空行を禁止
Layout/EmptyLines:
  Enabled: true

# ---------- スペース ----------
Layout/SpaceInsideHashLiteralBraces:
  Enabled: true
  EnforcedStyle: space

Layout/SpaceAroundOperators:
  Enabled: true

Layout/SpaceBeforeBlockBraces:
  Enabled: true
  EnforcedStyle: space

Layout/SpaceInsideBlockBraces:
  Enabled: true
  EnforcedStyle: space

Layout/SpaceInsideArrayLiteralBrackets:
  Enabled: true
  EnforcedStyle: no_space

Layout/SpaceInsideParens:
  Enabled: true
  EnforcedStyle: no_space

Layout/SpaceInsideRangeLiteral:
  Enabled: true

Layout/SpaceAroundEqualsInParameterDefault:
  Enabled: true
  EnforcedStyle: space

Layout/SpaceAroundMethodCallOperator:
  Enabled: true

Layout/SpaceBeforeComma:
  Enabled: true

Layout/SpaceAfterComma:
  Enabled: true

Layout/SpaceAfterColon:
  Enabled: true

Layout/SpaceAfterSemicolon:
  Enabled: true

Layout/SpaceBeforeFirstArg:
  Enabled: true

Layout/SpaceBeforeBrackets:
  Enabled: true

# ---------- 末尾の空白・空行 ----------
Layout/TrailingWhitespace:
  Enabled: true
  AllowInHeredoc: false

Layout/TrailingEmptyLines:
  Enabled: true
  EnforcedStyle: final_newline

# ---------- 複数行のフォーマット ----------
Layout/MultilineMethodCallIndentation:
  Enabled: true
  EnforcedStyle: indented

Layout/MultilineAssignmentLayout:
  Enabled: true
  EnforcedStyle: new_line

Layout/MultilineOperationIndentation:
  Enabled: true
  EnforcedStyle: indented

Layout/FirstMethodArgumentLineBreak:
  Enabled: true

Layout/FirstArrayElementIndentation:
  Enabled: true
  EnforcedStyle: consistent

Layout/FirstHashElementIndentation:
  Enabled: true
  EnforcedStyle: consistent

Layout/FirstArgumentIndentation:
  Enabled: true
  EnforcedStyle: consistent

Layout/HashAlignment:
  Enabled: true
  EnforcedHashRocketStyle: key
  EnforcedColonStyle: key

Layout/ArgumentAlignment:
  Enabled: true
  EnforcedStyle: with_first_argument

Layout/ParameterAlignment:
  Enabled: true
  EnforcedStyle: with_first_parameter

Layout/MultilineHashKeyLineBreaks:
  Enabled: true
  AllowMultilineFinalElement: false

Layout/LineEndStringConcatenationIndentation:
  Enabled: true

# ---------- コメント ----------
Layout/CommentIndentation:
  Enabled: true

Layout/LeadingCommentSpace:
  Enabled: true

# ============================================================
# Style（コーディングスタイル）
# ============================================================

# ---------- 文字列 ----------
Style/AsciiComments:
  Enabled: true

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: double_quotes

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always

# ---------- ハッシュ・配列 ----------
Style/HashSyntax:
  Enabled: true
  EnforcedStyle: ruby19_no_mixed_keys
  EnforcedShorthandSyntax: either

Style/TrailingCommaInArrayLiteral:
  Enabled: true
  EnforcedStyleForMultiline: consistent_comma

Style/TrailingCommaInHashLiteral:
  Enabled: true
  EnforcedStyleForMultiline: consistent_comma

Style/TrailingCommaInArguments:
  Enabled: true
  EnforcedStyleForMultiline: consistent_comma

Style/WordArray:
  Enabled: true
  EnforcedStyle: percent
  MinSize: 3

Style/SymbolArray:
  Enabled: true
  EnforcedStyle: percent
  MinSize: 3

# ---------- メソッド定義 ----------
Style/DefWithParentheses:
  Enabled: true

Style/MethodDefParentheses:
  Enabled: true
  EnforcedStyle: require_parentheses

Style/EmptyMethod:
  Enabled: true
  EnforcedStyle: expanded

# ---------- 条件式 ----------
Style/ConditionalAssignment:
  Enabled: true
  EnforcedStyle: assign_to_condition

Style/TernaryParentheses:
  Enabled: true
  EnforcedStyle: require_parentheses_when_complex

# ---------- 数値・リテラル ----------
Style/NumericLiterals:
  Enabled: true
  MinDigits: 5
  Strict: false

Style/PercentLiteralDelimiters:
  Enabled: true
  PreferredDelimiters:
    "%": "()"
    "%i": "()"
    "%I": "()"
    "%q": "()"
    "%Q": "()"
    "%r": "{}"
    "%s": "()"
    "%w": "()"
    "%W": "()"
    "%x": "()"

# ---------- その他のStyle ----------
Style/Documentation:
  Enabled: false

Style/ArgumentsForwarding:
  Enabled: true

Style/CollectionCompact:
  Enabled: true

Style/DocumentDynamicEvalDefinition:
  Enabled: true

Style/EndlessMethod:
  Enabled: true

Style/HashConversion:
  Enabled: true

Style/HashExcept:
  Enabled: true

Style/IfWithBooleanLiteralBranches:
  Enabled: true

Style/InPatternThen:
  Enabled: true

Style/MultilineInPatternThen:
  Enabled: true

Style/NilLambda:
  Enabled: true

Style/NumberedParameters:
  Enabled: true

Style/NumberedParametersLimit:
  Enabled: true

Style/QuotedSymbols:
  Enabled: true

Style/RedundantArgument:
  Enabled: true

Style/RedundantSelfAssignmentBranch:
  Enabled: true

Style/SelectByRegexp:
  Enabled: true

Style/StringChars:
  Enabled: true

Style/SwapValues:
  Enabled: true

# ============================================================
# 3. コード品質
# ============================================================

# ---------- Metrics（コード複雑度・サイズ制限） ----------
Metrics/AbcSize:
  Enabled: true
  Max: 50
  Exclude:
    - "app/controllers/sign/app/auth/omniauth_callbacks_controller.rb"

Metrics/CyclomaticComplexity:
  Enabled: true
  Max: 18

Metrics/MethodLength:
  Enabled: true
  Max: 45
  Exclude:
    - "app/controllers/concerns/preference/base.rb"
    - "app/controllers/core/com/contact/telephones_controller.rb"

Metrics/PerceivedComplexity:
  Enabled: true
  Max: 18

Metrics/CollectionLiteralLength:
  Max: 80
  Exclude:
    - "db/**/*_migrate/**/*"
    - "test/**/*"

