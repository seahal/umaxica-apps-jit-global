Layout/CaseIndentation:
  EnforcedStyle: end

# ============================================================
# 14. Cops this project does not apply
# ============================================================

# Rewrites `ENV["NAME"]` to `ENV.fetch("NAME", nil)`, which is the code-side default that
# adr/env-fetch-without-default.md forbids. An optional variable is read as `ENV["NAME"]` with an
# explicit nil branch.
Style/FetchEnvVar:
  Enabled: false

# Contradicts Umaxica/ExplicitMethodVisibility, which requires the explicit `public` this cop reports.
Lint/UselessAccessModifier:
  Enabled: false

# Suppression comments are being removed, not restyled; converting a `disable`/`enable` pair to
# `disable-next` would keep the suppression and only change its spelling.
Style/DirectiveScope:
  Enabled: false

