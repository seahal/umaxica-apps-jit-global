# RuboCop configuration.
#
# This file and the plugins it names are the whole coding contract: nothing is inherited from a
# shared style gem, so every cop that is off is off because an entry in this file says so.
#
# Sections:
#  1. Base settings (AllCops, plugins, inheritance)
#  2. Layout and formatting
#  3. Code quality (Metrics, Lint)
#  4. Security
#  5. Rails
#  6. Performance
#  7. Minitest
#  8. Naming, Rake, I18n
#  9-13. Additional strictness
# 14. Cops this project does not apply
# 15. Deferred cops (debt)

# `.rubocop/umaxica.yml` loads the two architecture cops. `.rubocop_todo.yml` is their generated
# baseline (`bin/rails architecture:baseline`) and carries entries for those two cops only; no
# other cop may be recorded there.
inherit_from:
  - .rubocop/umaxica.yml
  - .rubocop_todo.yml

# An `Exclude` written here adds to a cop's default exclusions instead of replacing them.
inherit_mode:
  merge:
    - Exclude

# A `rubocop:disable` comment is an offense. The cops listed under AllowedCops are the ones that
# still carried suppressions when this rule was switched on; each entry is debt to remove, and the
# list only ever shrinks. A new offense is fixed in the code or decided in this file, never
# silenced where it occurs.
Style/DisableCopsWithinSourceCodeDirective:
  Enabled: true
  AllowedCops:
    - I18n/RailsI18n/DecorateString
    - I18n/RailsI18n/DecorateStringFormattingUsingInterpolation
    - Layout/LineLength
    - Lint/NoReturnInBeginEndBlocks
    - Metrics/AbcSize
    - Metrics/MethodLength
    - Minitest/MultipleAssertions
    - Naming/MethodParameterName
    - Rails/ApplicationController
    - Rails/HasManyOrHasOneDependent
    - Rails/I18nLocaleAssignment
    - Rails/I18nLocaleTexts
    - Rails/IndexWith
    - Rails/RakeEnvironment
    - Rails/RedundantPresenceValidationOnBelongsTo
    - Rails/RefuteMethods
    - Rails/SkipsModelValidations
    - ThreadSafety/ClassAndModuleAttributes
    - ThreadSafety/ClassInstanceVariable

Lint/CopDirectiveSyntax:
  Enabled: true

Lint/RedundantCopDisableDirective:
  Enabled: true

Lint/RedundantCopEnableDirective:
  Enabled: true

Lint/MissingCopEnableDirective:
  Enabled: true

# ============================================================
# 1. Base settings
# ============================================================

plugins:
  - rubocop-performance
  - rubocop-thread_safety
  - rubocop-rake
  - rubocop-minitest
  - rubocop-i18n
  - rubocop-rubycw
  - rubocop-rails

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  UseProjectIndex: true
  SuggestExtensions: false
  UseCache: true
  CacheRootDirectory: tmp/rubocop_cache
  Exclude:
    - "vendor/**/*"
    - "node_modules/**/*"
    - "db/schema.rb"
    - "db/*_schema.rb"
    - "db/**/*_migrate/**/*.rb"
    - "specs/avatar-organization-ownership/migration-drafts/**/*.rb"
    - "bin/**/*"
    - "tmp/**/*"
    - "log/**/*"
    - "**/*.md"
  Include:
    - "**/*.rb"
    - "**/*.rake"
    - "**/Gemfile"
    - "**/Rakefile"

# ============================================================
# 2. レイアウト・フォーマット
# ============================================================

Layout:
  Enabled: true

# ------------------------------------------------------------
# Class structure: one declaration order for controllers and models
# ------------------------------------------------------------
# A single category list serves both: a controller has no associations and a model has no filters,
# so the categories that do not occur in a file simply take no part in its ordering.
Layout/ClassStructure:
  Enabled: true
  # Models are not included yet. The order below is the target for them too, and 356 declarations
  # in 180 model files are out of it. Reordering a class body can change behavior (a callback or
  # validation declared earlier runs earlier, a macro may read a constant or attribute declared
  # above it), so each class is moved by hand and checked; the cop's autocorrection is never applied
  # in bulk. Add `app/models/**/*.rb` here once those files are in order.
  Include:
    - app/controllers/**/*.rb
  Categories:
    module_inclusion:
      - include
      - prepend
      - extend
    constants:
      - CONSTANT
    attributes:
      - class_attribute
      - attribute
      - alias_attribute
      - encrypts
    enums:
      - enum
    associations:
      - belongs_to
      - has_one
      - has_many
      - has_and_belongs_to_many
    nested_attributes:
      - accepts_nested_attributes_for
    validations:
      - validates
      - validate
    callbacks:
      - after_initialize
      - before_validation
      - after_validation
      - before_save
      - around_save
      - before_create
      - around_create
      - after_create
      - before_update
      - around_update
      - after_update
      - before_destroy
      - around_destroy
      - after_destroy
      - after_save
      - after_commit
      - after_rollback
    delegates:
      - delegate
    scopes:
      - default_scope
      - scope
    macros:
      - layout
      - respond_to
      - helper
      - helper_method
      - before_action
      - after_action
      - around_action
      - skip_before_action
      - skip_after_action
      - skip_around_action
    public_class_methods:
      - public_class_method
    initializer:
      - initialize
    public_methods:
      - public_method
    protected_methods:
      - protected_method
    private_methods:
      - private_method
  ExpectedOrder:
    - module_inclusion
    - constants
    - attributes
    - enums
    - associations
    - nested_attributes
    - validations
    - callbacks
    - delegates
    - scopes
    - macros
    - public_class_methods
    - initializer
    - public_methods
    - protected_methods
    - private_methods

