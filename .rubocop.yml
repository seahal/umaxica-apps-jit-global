# ============================================================
# 8. その他
# ============================================================

# ---------- Naming（命名規則） ----------
Naming/BlockForwarding:
  Enabled: true

Naming/InclusiveLanguage:
  Enabled: true
  FlaggedTerms:
    whitelist:
      Suggestions:
        - allowlist
        - permitted
    blacklist:
      Suggestions:
        - denylist
        - blocked

# ---------- Rake ----------
Rake:
  Enabled: true

Rake/ClassDefinitionInTask:
  Enabled: true

Rake/Desc:
  Enabled: true

Rake/DuplicateNamespace:
  Enabled: true

Rake/DuplicateTask:
  Enabled: true

Rake/MethodDefinitionInTask:
  Enabled: true

# ---------- I18n ----------
I18n/RailsI18n:
  Enabled: true

# Developer-facing diagnostics from the architecture harness itself. These strings are never
# rendered to a user and must not be localized.
I18n/RailsI18n/DecorateString:
  Exclude:
    - "lib/architecture_baseline.rb"
    - "lib/rubocop/cop/umaxica/*.rb"
    - "test/tooling/architecture_baseline_test.rb"

# Ban inline default: literal in t() and I18n.t()
# Ref: F3. i18n inline default: literal ban
I18n/GetText:
  Enabled: false

# ============================================================
# 9. Thread Safety (Strengthened)
# ============================================================

ThreadSafety/RackMiddlewareInstanceVariable:
  Enabled: true

# ============================================================
# 10. Additional Strictness for Accident Prevention
# ============================================================

# Suggest using safe navigation operator &.
Style/SafeNavigation:
  Enabled: true

# Prevent using return in a block (can cause LocalJumpError)
Lint/NonLocalExitFromIterator:
  Enabled: true

# Prevent unintentional assignment in conditions
Lint/AssignmentInCondition:
  Enabled: true
  AllowSafeAssignment: false

# Prevent infinite loops
Lint/Loop:
  Enabled: true

# Ensure 'to_i' etc are called safely
Lint/SafeNavigationConsistency:
  Enabled: true

# Disallow 'return' where it's not needed (prevent dead code or confusion)
Style/RedundantReturn:
  Enabled: true
  AllowMultipleReturnValues: true

# Force use of .blank? or .present? in Rails (more robust than nil? or empty?)
Rails/Blank:
  Enabled: true

# ============================================================
# 11. Custom Rules for Technical Debt Prevention
# ============================================================

# Disallow new TODO / FIXME annotations without an issue number
# Example allowed: TODO(#123): Fix this part
# Example disallowed: TODO: Fix this part
Style/CommentAnnotation:
  Enabled: true
  RequireColon: true
  Keywords:
    - TODO
    - FIXME
    - OPTIMIZE
    - HACK
    - REVIEW
  # (Optional: If you want to require issue numbers, you could craft a custom cop,
  # but base CommentAnnotation flags these keywords so we can review them).

# ============================================================
# 12. Additional Strictness（追加の厳格化）
# ============================================================

# ---------- Lint: 追加バグ検出 ----------

# 無意味な void 式（x; 1 + 1; など）を検出
Lint/Void:
  Enabled: true
  CheckForMethodsWithNoSideEffects: true

# 同一オペランドの二項演算（x || x, x && x など）を禁止
Lint/BinaryOperatorWithIdenticalOperands:
  Enabled: true

# 正規表現で名前付き・位置キャプチャを混在させることを禁止
Lint/MixedRegexpCaptureTypes:
  Enabled: true

# Float の等値比較を禁止（精度問題）
Lint/FloatComparison:
  Enabled: true

# BigDecimal.new の代わりに BigDecimal() を強制
Lint/BigDecimalNew:
  Enabled: true

# rescue 節の変数名を一貫させる（例: rescue => e ではなく rescue => err 等）
# デフォルトは "e" なので Ruby 慣習に従う
Naming/RescuedExceptionsVariableName:
  Enabled: true
  PreferredName: "e"

# ---------- Style: 追加スタイル ----------

# ガード節（早期 return）の強制 — ネストを減らす
Style/GuardClause:
  Enabled: true
  MinBodyLength: 1

# 述語メソッドで不必要に nil を return しない
# 例: def valid?; return nil if ...; end → Enabled で警告
Style/ReturnNilInPredicateMethodDefinition:
  Enabled: true

# 冗長な条件式の除去（if x; x; else; y; end → x || y）
Style/RedundantCondition:
  Enabled: true

# 不要な self の除去
Style/RedundantSelf:
  Enabled: true

# クラスメソッドは module_function より extend self を優先
Style/ModuleFunction:
  Enabled: true
  EnforcedStyle: module_function

# ---------- Metrics: より厳格な上限 ----------

# ネストの深さ: 既存 max 2 を維持しつつ全ファイルに適用
Metrics/BlockNesting:
  Max: 2
  # AllCops の Exclude が適用されるのでここでは除外不要

# パラメータ数の厳格化（既存 max: 4、これを全ファイルで強制）
# （既存設定を上書き: MaxOptionalParameters を 1 に絞る）
Metrics/ParameterLists:
  Max: 4
  MaxOptionalParameters: 1

# ---------- Naming: 追加命名規則 ----------

# メソッドパラメータ名の最低文字数（1文字は原則禁止）
Naming/MethodParameterName:
  Enabled: true
  MinNameLength: 2
  AllowedNames:
    - _
    - e
    - i
    - j
    - n
    - x
    - y
    - io
    - id

# ---------- Security: 追加 ----------

# open() の代わりに IO.popen 等を使用させる
# ※ 既存の Security/Open を補完
Security/IoMethods:
  Enabled: true

# ============================================================
# 13. 追加強化 Cops（デフォルト無効だが価値が高いもの）
# ============================================================

# ---------- Lint: 安全でない暗黙変換の検出 ----------

# to_i / to_f は無効な入力で 0 を返すため Integer() / Float() の方が厳密だが、このコップの
# 対象の大半は Time / Duration / Numeric レシーバで、そこでは to_i が正しい。unsafe な
# 自動修正を当てると Integer(Time, 10) が生成されて ArgumentError で落ちる。
# 文字列パースを厳密化したい箇所は個別に Integer() を書く。
Lint/NumberConversion:
  Enabled: false

# ブロック外のローカル変数をシャドウイングするブロック引数を検出
# （Section 10 の ShadowingOuterLocalVariable と重複するが明示的に再確認）

# ---------- Style: リソースリーク・例外安全性 ----------

# File.open 等はブロック形式を強制（リソースリーク防止）
Style/AutoResourceCleanup:
  Enabled: true

# 裸の raise "message" を禁止 — 明示的なエラークラスを強制
Style/ImplicitRuntimeError:
  Enabled: true

# ハードコードされた IP アドレスを検出（セキュリティ監査）
Style/IpAddresses:
  Enabled: true
  Exclude:
    - "config/**/*"
    - "test/**/*"
    - "docker/**/*"
    - "podman/**/*"
    - "db/**/*_migrate/**/*"
    - "db/initial_schemas/**/*"

# メソッド呼び出しの括弧を強制（可読性向上）
Style/MethodCallWithArgsParentheses:
  Enabled: true
  EnforcedStyle: require_parentheses
  AllowedMethods:
    - require
    - require_relative
    - include
    - extend
    - prepend
    - raise
    - puts
    - print
    - pp
    - p
    - yield
    - sleep
    - desc
    - task
    - gem
    - source
    - ruby
    - group
    - git_source
    - redirect
    - render
    - head
    - layout
    - helper
    - helper_method
    - respond_to
    - before_action
    - after_action
    - around_action
    - skip_before_action
    - skip_after_action
    - skip_around_action
    - belongs_to
    - has_many
    - has_one
    - validates
    - validate
    - scope
    - delegate
    - attr_accessor
    - attr_reader
    - attr_writer
    - private
    - protected
    - public
  AllowedPatterns:
    - "^assert"
    - "^refute"
  Exclude:
    - "Gemfile"

# ClassLength を引き下げ
Metrics/ClassLength:
  Max: 150

# ModuleLength を引き下げ
Metrics/ModuleLength:
  Max: 100

# BlockLength を引き下げ
Metrics/BlockLength:
  Max: 30
  Exclude:
    - "config/**/*"
    - "db/**/*_migrate/**/*"
    - "db/initial_schemas/**/*"
    - "test/**/*"

Style/ConstantVisibility:
  Exclude:
    - "db/**/*_migrate/**/*.rb"

Layout/LineLength:
  Enabled: true
  Max: 120
  # A comment is prose, and rewrapping it to fit is churn. `\A#` only matched a comment in
  # column 0, so every indented comment was still measured - allow leading whitespace.
  AllowedPatterns: ['\A\s*#']
  # Never let the autocorrect break a long literal across lines. It rewrites the literal as
  # interpolated fragments, which silently corrupts any regex or escape-bearing string -
  # `\b` inside the generated double-quoted fragment stops being a word boundary. A long
  # literal is reworded by a person or left alone.
  SplitStrings: false
  Exclude:
    - "db/**/*_migrate/**/*.rb"
    - "db/initial_schemas/**/*.rb"

Rails/SkipsModelValidations:
  Exclude:
    - "test/**/*.rb"
    - "app/models/application_record.rb"

Rails/ApplicationController:
  Exclude:
    - "app/controllers/**/bare_controller.rb"

ThreadSafety/ClassInstanceVariable:
  Exclude:
    - "test/**/*.rb"
    # Write-once memoization of a pure function of boot config and process environment, both fixed
    # after boot. A race can only recompute the same frozen value.
    - "app/values/fqdn_availability_registry.rb"
    - "app/controllers/concerns/social_callback_guard.rb"
    - "lib/jit/security/turnstile_verifier.rb"
    - "lib/jit/security/jwt/jti_generator.rb"

ThreadSafety/MutableClassInstanceVariable:
  Exclude:
    - "test/**/*.rb"
